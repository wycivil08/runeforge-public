<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>骸原铁誓 · 近战试炼</title>
<style>
:root{--ink:#0a090b;--gold:#b9a36c;--bone:#d5c9ae;--edge:#5a5242}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;overflow:hidden;color:var(--bone);
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.panel{background:linear-gradient(180deg,rgba(40,38,43,.93),rgba(17,16,19,.93));border:1px solid var(--edge);
  box-shadow:0 0 0 1px #09080a,inset 0 1px 0 rgba(255,235,190,.08),0 6px 18px rgba(0,0,0,.6);border-radius:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:2px;color:#9c8f70}
#hudL{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));padding:10px 14px 9px;width:min(300px,56vw);z-index:10;pointer-events:none}
#hpBar{position:relative;flex:1;min-width:90px;height:14px;background:#0d0b0c;border:1px solid #6a604b;box-shadow:inset 0 2px 4px #000}
#hpLag{position:absolute;left:0;top:0;bottom:0;width:100%;background:#cbb47a;opacity:.5}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#b9281d,#70100c 60%,#470907)}
#hpBar::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 24%,rgba(0,0,0,.5) 24% 25%)}
#hpTxt{font-size:15px;min-width:30px;text-align:right;color:#e6d9b8;font-weight:700}
#hudL .row+.row{margin-top:7px}
#kills,#time{font-size:15px;color:#e6d9b8;font-weight:700;min-width:22px}
.sep{width:1px;height:12px;background:#4a4437;margin:0 2px}
#dodgeRune{font-size:12px;letter-spacing:1px;color:#c9b98c;transition:color .15s,opacity .15s}
#dodgeRune.cd{color:#5a554a;opacity:.7}
#hudR{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));padding:8px 10px;z-index:10;max-width:min(430px,40vw)}
#hudR .row+.row{margin-top:7px}
button{font:inherit;color:#cdbf9c;background:linear-gradient(180deg,#35333b,#1c1b20);border:1px solid var(--edge);padding:5px 9px;font-size:12.5px;letter-spacing:.5px;cursor:pointer;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,240,200,.08);touch-action:manipulation}
button:hover{color:#f2e4ba;border-color:#8c7c58}
button.off{color:#77705f}
button.big{font-size:17px;padding:11px 30px;letter-spacing:4px;color:#ecdcae;border-color:#8c7c58}
button.sel{border-color:#c2a868;color:#f4e6bc;background:linear-gradient(180deg,#4a4132,#272219)}
input[type=range]{width:104px;accent-color:#9c8452;cursor:pointer}
#zoomTxt{font-size:12.5px;min-width:38px;color:#e6d9b8}
#hint{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:12.5px;letter-spacing:1px;color:#a89c7e;opacity:.75;pointer-events:none;z-index:9;text-shadow:0 1px 3px #000;white-space:nowrap}
#touchUI{display:none}
body.touch #touchUI{display:block}
body.touch #hint{display:none}
#joy{position:fixed;left:0;bottom:0;width:46vw;height:52vh;z-index:8;touch-action:none}
#joyBase{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(30px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;border:2px solid rgba(160,145,105,.45);background:radial-gradient(circle,rgba(30,28,32,.35),rgba(10,10,12,.6));box-shadow:inset 0 0 18px #000}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#6a6458,#2a2824);border:1px solid #8c7c58;box-shadow:0 3px 8px #000}
.tbtn{position:fixed;z-index:8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#eadcb2;border:2px solid #8c7c58;background:radial-gradient(circle at 35% 30%,#5a2320,#250c0b);box-shadow:0 4px 12px #000,inset 0 1px 0 rgba(255,220,180,.15);touch-action:none}
#btnAtk{right:max(24px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom));width:96px;height:96px;font-size:30px}
#btnAtk.on{filter:brightness(1.45)}
#btnDodge{right:calc(max(24px,env(safe-area-inset-right)) + 112px);bottom:max(22px,env(safe-area-inset-bottom));width:64px;height:64px;font-size:20px;background:radial-gradient(circle at 35% 30%,#4a4a52,#1b1b20)}
#btnDodge.cd{opacity:.4}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20}
.hidden{display:none!important}
#ovTitle{background:radial-gradient(ellipse at center,rgba(5,5,7,.35) 0%,rgba(4,4,6,.88) 75%)}
#ovPause{background:rgba(4,4,6,.62)}
#ovDead{align-items:flex-end;padding-bottom:8vh;background:linear-gradient(180deg,rgba(0,0,0,0) 48%,rgba(0,0,0,.78));animation:fadeIn 1.1s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{padding:26px 34px 24px;text-align:center;max-width:92vw}
h1{margin:0 0 4px;font-size:clamp(34px,6vw,58px);letter-spacing:10px;font-weight:700;background:linear-gradient(180deg,#f1e2b4,#a88c50 55%,#5e4a28);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.3)}
h2{margin:0 0 6px;font-size:28px;letter-spacing:8px;color:#d9c592}
.sub{font-size:12.5px;letter-spacing:5px;color:#8f8368;margin-bottom:18px}
.txt{font-size:13.5px;line-height:1.9;color:#b3a788;margin:10px 0 16px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
#deadStats{font-size:16px;letter-spacing:2px;color:#d6c8a2;margin:8px 0 16px}
@media (max-width:760px){
  #hudL{padding:7px 9px;width:min(230px,50vw)} #hudR{padding:6px 7px;max-width:46vw}
  button{padding:4px 6px;font-size:11.5px} input[type=range]{width:70px} .lbl{letter-spacing:1px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudL" class="panel">
  <div class="row"><span class="lbl">生命</span><div id="hpBar"><div id="hpLag"></div><div id="hpFill"></div></div><span id="hpTxt">100</span></div>
  <div class="row"><span class="lbl">斩杀</span><span id="kills">0</span><span class="sep"></span><span class="lbl">存活</span><span id="time">0:00</span><span class="sep"></span><span id="dodgeRune">◈ 闪避</span></div>
</div>

<div id="hudR" class="panel">
  <div class="row">
    <button id="btnMode">操作：键鼠</button>
    <button id="btnSnd">音效：开</button>
    <button id="btnShake">震动：开</button>
    <button id="btnPause">暂停</button>
  </div>
  <div class="row"><span class="lbl">镜头</span><input id="zoom" type="range" min="0.75" max="1.5" step="0.05" value="1"><span id="zoomTxt">100%</span><button id="btnZoomR">复位</button></div>
</div>

<div id="hint"></div>

<div id="touchUI">
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="btnDodge" class="tbtn">避</div>
  <div id="btnAtk" class="tbtn">斩</div>
</div>

<div id="ovTitle" class="overlay">
  <div class="card panel">
    <h1>骸原铁誓</h1>
    <div class="sub">ASHEN OATH · 近战试炼</div>
    <div class="txt">亡骨自灰土中爬起，永无止息。<br>握紧大剑——斩，直到倒下。</div>
    <div class="modes">
      <button class="modeBtn" data-mode="kb">键鼠：WASD + 鼠标瞄准</button>
      <button class="modeBtn" data-mode="mouse">鼠标：右键行走 / 左键斩</button>
      <button class="modeBtn" data-mode="touch">触屏：摇杆 + 按钮</button>
    </div>
    <button id="btnStart" class="big">踏入战场</button>
  </div>
</div>

<div id="ovPause" class="overlay hidden">
  <div class="card panel">
    <h2>暂 停</h2>
    <div class="txt">P / Esc 继续 · M 静音<br>空格 / Shift 闪避（短暂无敌，仅有冷却）</div>
    <button id="btnResume" class="big">继续</button>
  </div>
</div>

<div id="ovDead" class="overlay hidden">
  <div class="card panel">
    <h2>汝已倒下</h2>
    <div id="deadStats"></div>
    <button id="btnRestart" class="big">再战一场</button>
  </div>
</div>

<script>
/* 骸原铁誓 —— 单文件近战战斗样本。全部美术/音效为程序化生成，无外部依赖。
   说明：本文件为一次性手写交付，未声明经过任何实机测试。 */
(() => {
'use strict';

/* =====================================================================
   1. 配置 CONFIG
   ===================================================================== */
const CFG = {
  world: { w: 4000, h: 3000, chunk: 400, cell: 50, res: 1.5, maxChunks: 30 },
  view:  { base: 560, zoomMin: .75, zoomMax: 1.5, zoomDef: 1 },
  hero:  { r: 15, speed: 176, hp: 100, blade: 60, healOnKill: 2 },
  atk:   { windup: .15, windupChain: .12, swing: .13, recover: .28, chainAt: .1,
           dmgMin: 30, dmgMax: 42, crit: .12, critMul: 1.75, lunge: 170, buffer: .2 },
  dodge: { time: .26, speed: 520, cd: .8, inv: .24 },
  enemy: { max: 22, maxAttackers: 3, hp: 58, bruteHp: 150, maxBrutes: 3 },
  fx:    { maxParticles: 220, maxDebris: 150, maxNumbers: 40, maxTrail: 90,
           stopHit: .05, stopCrit: .075, stopKill: .065, stopCap: .13 }
};

/* =====================================================================
   2. 工具 UTIL
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rot = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
function hashI(i, j, p) { return (Math.imul(i, 73856093) ^ Math.imul(j, 19349663) ^ Math.imul(p | 0, 83492791)) >>> 0; }
function hash2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1e-6;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return { d: Math.hypot(px - cx, py - cy), x: cx, y: cy };
}
function elbow(x1, y1, x2, y2, l1, l2, sg) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1e-4;
  const dm = Math.min(d, l1 + l2 - .01);
  const a = (l1 * l1 - l2 * l2 + dm * dm) / (2 * dm);
  const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [x1 + ux * a - uy * hh * sg, y1 + uy * a + ux * hh * sg];
}

/* =====================================================================
   3. 音频 AUDIO（WebAudio 程序化音效，首次操作后解锁）
   ===================================================================== */
const Sfx = (() => {
  let ac = null, master = null, nbuf = null, muted = false, wantSuspend = false;
  const live = new Set(), last = {};
  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try {
        ac = new AC();
        master = ac.createGain(); master.gain.value = muted ? 0 : .85;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5;
        master.connect(comp); comp.connect(ac.destination);
        nbuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 1.5), ac.sampleRate);
        const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        startAmb();
      } catch (err) { ac = null; return; }
    }
    if (ac.state === 'suspended' && !wantSuspend) { try { ac.resume(); } catch (e) {} }
  }
  function startAmb() {
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 230;
    const g = ac.createGain(); g.gain.value = .045;
    const lfo = ac.createOscillator(); lfo.frequency.value = .07; const lg = ac.createGain(); lg.gain.value = 70;
    lfo.connect(lg); lg.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(master); s.start(); lfo.start();
  }
  function keep(src, g) { live.add(src); src.onended = () => { live.delete(src); try { g.disconnect(); } catch (e) {} }; }
  function env(g, t, vol, atk, dur) {
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  function noise(o) {
    const t = ac.currentTime + (o.at || 0);
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    f.Q.value = o.q || 1;
    const g = ac.createGain(); env(g, t, o.vol, o.atk || .004, o.dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()); s.stop(t + o.dur + .03); keep(s, g);
  }
  function tone(o) {
    const t = ac.currentTime + (o.at || 0);
    const os = ac.createOscillator(); os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.f0, t); if (o.f1) os.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    const g = ac.createGain(); env(g, t, o.vol, o.atk || .004, o.dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t + o.dur + .03); keep(os, g);
  }
  function ok(name, gap) {
    if (!ac || ac.state !== 'running') return false;
    const t = ac.currentTime; if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  }
  return {
    unlock,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : .85; },
    isMuted() { return muted; },
    suspend(b) { wantSuspend = b; if (!ac) return; try { if (b) ac.suspend(); else ac.resume(); } catch (e) {} },
    stopAll() {
      for (const s of live) { try { s.onended = null; s.stop(); s.disconnect(); } catch (e) {} }
      live.clear(); for (const k in last) delete last[k];
    },
    swing() { if (!ok('sw', .05)) return; const p = rand(.92, 1.1);
      noise({ dur: .19, f0: 420 * p, f1: 2600 * p, q: 1.1, vol: .34, atk: .05 });
      noise({ dur: .14, type: 'lowpass', f0: 500, f1: 200, vol: .12, atk: .03 }); },
    hit(crit, kill, brute) { if (!ok('hit', .025)) return; const p = rand(.9, 1.12);
      tone({ f0: 170 * p, f1: 48, dur: .13, vol: .6 });
      noise({ dur: .07, f0: 1900 * p, f1: 700, q: .8, vol: .42, atk: .002 });
      noise({ dur: .035, type: 'highpass', f0: 3800, vol: .2, atk: .001 });
      if (brute || crit) { tone({ type: 'triangle', f0: 1180 * p, f1: 1050, dur: .24, vol: .09 }); tone({ type: 'square', f0: 2380 * p, dur: .1, vol: .025 }); }
      if (kill) { for (let i = 0; i < 4; i++) noise({ at: .04 + i * .05 + Math.random() * .02, dur: .04, f0: rand(1400, 3200), q: 7, vol: .2, atk: .002 });
        tone({ at: .02, f0: 95, f1: 40, dur: .2, vol: .3 }); } },
    step() { if (!ok('st', .12)) return;
      noise({ dur: .06, type: 'lowpass', f0: rand(200, 280), vol: .13, atk: .003 });
      noise({ dur: .025, f0: rand(3400, 4200), q: 4, vol: .022, atk: .002 }); },
    hurt() { if (!ok('hu', .08)) return;
      tone({ type: 'sawtooth', f0: 170, f1: 70, dur: .2, vol: .22 });
      noise({ dur: .13, type: 'lowpass', f0: 900, f1: 300, vol: .38, atk: .002 });
      tone({ type: 'triangle', f0: 760, f1: 700, dur: .12, vol: .06 }); },
    enemySwing() { if (!ok('es', .06)) return; noise({ dur: .13, f0: 380, f1: 1300, q: 1, vol: .13, atk: .04 }); },
    dodge() { if (!ok('dg', .1)) return; noise({ dur: .22, f0: 300, f1: 1300, q: .7, vol: .2, atk: .05 }); },
    spawn() { if (!ok('sp', .3)) return; noise({ dur: .32, type: 'lowpass', f0: 190, f1: 80, vol: .12, atk: .05 }); },
    clank() { if (!ok('ck', .1)) return; tone({ type: 'triangle', f0: 1500, f1: 1380, dur: .3, vol: .1 }); tone({ type: 'square', f0: 2900, dur: .08, vol: .03 }); noise({ dur: .05, f0: 2600, q: 2, vol: .18, atk: .001 }); },
    death() { if (!ok('de', .5)) return;
      tone({ f0: 110, f1: 38, dur: 1.6, vol: .5, atk: .02 });
      noise({ dur: 1.2, type: 'lowpass', f0: 500, f1: 80, vol: .25, atk: .02 });
      tone({ type: 'triangle', f0: 220, f1: 55, dur: 1.4, vol: .12 }); },
    ui() { if (!ok('ui', .05)) return; tone({ type: 'triangle', f0: 520, f1: 420, dur: .07, vol: .08 }); }
  };
})();

/* =====================================================================
   4. 输入 INPUT（键鼠 / 纯鼠标 / 触屏，切换与失焦时全部清零）
   ===================================================================== */
const Input = (() => {
  const keys = new Set();
  const st = { mode: 'kb', mx: innerWidth / 2, my: innerHeight / 2, lmb: false, rmb: false,
               jx: 0, jy: 0, joyId: null, atk: false, atkId: null, dodgeQ: false };
  let knobEl = null, atkEl = null;
  function reset() {
    keys.clear(); st.lmb = st.rmb = false; st.jx = st.jy = 0; st.joyId = null;
    st.atk = false; st.atkId = null; st.dodgeQ = false;
    if (knobEl) knobEl.style.transform = 'translate(-50%,-50%)';
    if (atkEl) atkEl.classList.remove('on');
  }
  function setMode(m) { st.mode = m; reset(); }
  function init(o) {
    const cv = o.canvas, joy = o.joy, base = o.joyBase, dodgeEl = o.dodge;
    knobEl = o.knob; atkEl = o.atk;
    addEventListener('keydown', e => {
      o.onAction();
      const c = e.code;
      if (c === 'Space' || c.startsWith('Arrow')) e.preventDefault();
      if (e.repeat) return;
      keys.add(c);
      if (c === 'Space' || c === 'ShiftLeft' || c === 'ShiftRight') st.dodgeQ = true;
      o.onKey(c);
    });
    addEventListener('keyup', e => keys.delete(e.code));
    cv.addEventListener('mousedown', e => {
      o.onAction(); e.preventDefault(); st.mx = e.clientX; st.my = e.clientY;
      if (e.button === 0) st.lmb = true; else if (e.button === 2) st.rmb = true;
    });
    addEventListener('mouseup', e => { if (e.button === 0) st.lmb = false; else if (e.button === 2) st.rmb = false; });
    addEventListener('mousemove', e => {
      st.mx = e.clientX; st.my = e.clientY;
      if (!(e.buttons & 1)) st.lmb = false; if (!(e.buttons & 2)) st.rmb = false;   // 防止窗外松键造成卡键
    });

  if (st.mode === 'kb') {
    c.mx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0);
    c.my = (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0) - (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0);
    const l = Math.hypot(c.mx, c.my); if (l > 1) { c.mx /= l; c.my /= l; }
    const w = s2w(st.mx, st.my); c.aim = Math.atan2(w[1] - (h.y - 10), w[0] - h.x); c.attack = st.lmb || K.has('KeyJ');
  } else if (st.mode === 'mouse') {
    const w = s2w(st.mx, st.my), dx = w[0] - h.x, dy = w[1] - (h.y - 10), d = Math.hypot(dx, dy);
    c.aim = d > 6 ? Math.atan2(dy, dx) : h.aim;
    if (st.rmb && d > 16) { const k = Math.min(1, d / 50); c.mx = dx / d * k; c.my = dy / d * k; }
    c.attack = st.lmb;
  } else {
    const l = Math.hypot(st.jx, st.jy);
    if (l > .2) { const k = Math.min(1, (l - .2) / .7) / l; c.mx = st.jx * k; c.my = st.jy * k; }
    c.attack = st.atk;
  }
  return c;
}
function updateCamera(rdt) {
  const cam = G.cam, h = G.hero;
  cam.zoom += (cam.zoomT - cam.zoom) * Math.min(1, rdt * 10);
  const dzT = (G.state === 'dying' || G.state === 'dead') ? 1 : 0; cam.dz += (dzT - cam.dz) * Math.min(1, rdt * 1.2);
  View.scale = View.base * cam.zoom * (1 + .07 * cam.dz);
  let tx = h.x, ty = h.y - 8;
  if (G.state === 'play' && Input.st.mode !== 'touch') { const w = s2w(Input.st.mx, Input.st.my); tx += clamp((w[0] - h.x) * .1, -45, 45); ty += clamp((w[1] - h.y) * .1, -35, 35); }
  const k = 1 - Math.exp(-rdt * 7); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const hw = View.cw / (2 * View.scale), hh = View.ch / (2 * View.scale);
  if (hw - 90 < World.W - hw + 90) cam.x = clamp(cam.x, hw - 90, World.W - hw + 90);
  if (hh - 90 < World.H - hh + 90) cam.y = clamp(cam.y, hh - 90, World.H - hh + 90);
  cam.trauma = Math.max(0, cam.trauma - rdt * 2.6); const kd = Math.exp(-rdt * 20); cam.kx *= kd; cam.ky *= kd;
  if (G.opt.shake) {
    const a = cam.trauma * cam.trauma * 5.5;
    cam.sx = (Math.sin(G.rt * 71) + Math.sin(G.rt * 113 + 1.3)) * .5 * a + cam.kx;
    cam.sy = (Math.sin(G.rt * 83 + 2.1) + Math.sin(G.rt * 127 + .7)) * .5 * a + cam.ky;
  } else { cam.sx = cam.sy = 0; }
}
function update(rdt) {
  G.rt += rdt;
  if (G.state === 'pause') return;
  let dt = rdt * G.timeScale;
  if (G.hitStop > 0) { G.hitStop -= rdt; dt *= .03; }      // 命中停顿
  G.t += dt;
  const c = sampleControls();
  updateHero(dt, c);
  if (G.state === 'play') { G.time += dt; updateSpawner(dt); }
  updateEnemies(dt);
  updateFx(dt, rdt);
  updateCamera(rdt);
  if (G.state === 'dying') {                               // 先完整播放倒地，再出重开界面
    G.deadClock += rdt; G.timeScale = Math.min(1, .35 + G.deadClock * .5);
    if (G.deadClock >= 2.7) { G.state = 'dead'; G.timeScale = 1; $('deadStats').textContent = '斩杀 ' + G.kills + '　·　存活 ' + UI.fmt(G.time); UI.show('ovDead', true); }
  }
  UI.sync(false);
}

let lastTs = 0;
function frame(ts) {
  const rdt = Math.min(.05, Math.max(0, (ts - lastTs) / 1000)); lastTs = ts;
  update(rdt); Render.draw();
  requestAnimationFrame(frame);
}

(function boot() {
  const canvas = $('game');
  G.hero = newHero();
  Render.init(canvas);
  Input.init({
    canvas, joy: $('joy'), joyBase: $('joyBase'), knob: $('joyKnob'), atk: $('btnAtk'), dodge: $('btnDodge'),
    onAction: () => Sfx.unlock(),
    onKey: c => {
      if (c === 'KeyP' || c === 'Escape') { if (G.state === 'play') setPause(true); else if (G.state === 'pause') setPause(false); }
      else if (c === 'KeyM') toggleMute();
      else if (c === 'KeyR') { if (G.state === 'dead') start(); }
      else if (c === 'Enter') { if (G.state === 'title' || G.state === 'dead') start(); else if (G.state === 'pause') setPause(false); }
    },
    onWheel: dy => UI.setZoom(Math.round((G.cam.zoomT + (dy > 0 ? -.05 : .05)) * 20) / 20),
    onBlur: () => { if (G.state === 'play') setPause(true); }
  });
  const click = (id, fn) => $(id).addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); fn(e); e.currentTarget.blur(); });
  const order = ['kb', 'mouse', 'touch'];
  click('btnMode', () => UI.setMode(order[(order.indexOf(Input.st.mode) + 1) % 3]));
  click('btnSnd', toggleMute);
  click('btnShake', e => { G.opt.shake = !G.opt.shake; e.currentTarget.textContent = '震动：' + (G.opt.shake ? '开' : '关'); e.currentTarget.classList.toggle('off', !G.opt.shake); });
  click('btnPause', () => { if (G.state === 'play') setPause(true); else if (G.state === 'pause') setPause(false); });
  click('btnZoomR', () => UI.setZoom(CFG.view.zoomDef));
  click('btnStart', start); click('btnRestart', start); click('btnResume', () => setPause(false));
  document.querySelectorAll('.modeBtn').forEach(b => b.addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); UI.setMode(b.dataset.mode); e.currentTarget.blur(); }));
  const z = $('zoom');
  z.addEventListener('input', () => UI.setZoom(parseFloat(z.value)));
  z.addEventListener('change', () => z.blur()); z.addEventListener('pointerup', () => z.blur());
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches && !matchMedia('(pointer:fine)').matches;
  UI.setMode(coarse ? 'touch' : 'kb');
  UI.setZoom(CFG.view.zoomDef); G.cam.zoom = CFG.view.zoomDef;
  UI.sync(true);
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });
})();

})();
</script>
</body>
