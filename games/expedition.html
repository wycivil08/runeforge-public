<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>符炉远征 · Runeforge Expedition</title>
<style>
:root{--ink:#0a090b;--bone:#d8ccb0;--dim:#978a6c;--edge:#5d543f;--gold:#bfa66a;--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;overflow:hidden;color:var(--bone);font-family:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.panel{position:relative;background:linear-gradient(180deg,rgba(34,31,30,.94),rgba(15,14,15,.95));border:2px solid var(--ink);outline:1px solid rgba(150,134,96,.45);outline-offset:-4px;box-shadow:0 0 0 1px rgba(110,98,70,.55),0 5px 16px rgba(0,0,0,.65)}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--gold);opacity:.75;pointer-events:none}
.panel::before{left:-2px;top:-2px;border-right:none;border-bottom:none}
.panel::after{right:-2px;bottom:-2px;border-left:none;border-top:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:2px;color:var(--dim);white-space:nowrap}
b{font-weight:700;color:#eadfc0;font-size:14px;white-space:nowrap}
.sep{width:1px;height:12px;background:#4a4437;display:inline-block}
.hidden{display:none!important}
.dim{color:#8f8368;font-size:12px}
#hudL{position:fixed;left:calc(10px + var(--sl));top:calc(10px + var(--st));padding:10px 14px 9px;width:min(330px,60vw);z-index:10;pointer-events:none}
#hudL .row+.row{margin-top:6px}
#hpBar{position:relative;flex:1;min-width:70px;height:15px;background:#0b090a;border:2px solid var(--ink);box-shadow:0 0 0 1px #6a604b,inset 0 2px 4px #000;overflow:hidden}
#hpLag{position:absolute;left:0;top:0;bottom:0;width:100%;background:#cbb47a;opacity:.55}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#b3261c,#7a120d 55%,#4a0907)}
#hpBar::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;background:repeating-linear-gradient(115deg,transparent 0 5px,rgba(0,0,0,.22) 5px 6px)}
#dgBar{position:relative;width:64px;height:8px;background:#0b090a;border:1px solid var(--ink);box-shadow:0 0 0 1px #5a5242;overflow:hidden}
#dgFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#d9d3c0,#8d8773)}
#dgBar.cd #dgFill{background:linear-gradient(180deg,#6d6a60,#45433d)}
#runeLine{display:flex;gap:3px;flex-wrap:wrap;flex:1}
.tag{font-size:11px;padding:1px 4px;border:1px solid #5a4c33;color:#e2cf9f;background:rgba(0,0,0,.45);white-space:nowrap}
#hudR{position:fixed;right:calc(10px + var(--sr));top:calc(10px + var(--st));z-index:16;display:flex;gap:6px;padding:6px 8px}
button{font:inherit;color:#d0c29e;background:linear-gradient(180deg,#34312f,#1a1919);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,240,200,.07);padding:6px 10px;font-size:12.5px;letter-spacing:.5px;cursor:pointer;border-radius:0;touch-action:manipulation}
button:hover{color:#f4e6bc;box-shadow:0 0 0 1px #9c8a60,inset 0 1px 0 rgba(255,240,200,.1)}
button.off{color:#77705f}
button.big{font-size:17px;padding:11px 28px;letter-spacing:4px;color:#ecdcae;box-shadow:0 0 0 1px #9c8a60;margin:4px}
button.sel{color:#f4e6bc;background:linear-gradient(180deg,#4a4132,#272219);box-shadow:0 0 0 1px #c2a868}
#bossHud{position:fixed;left:50%;top:calc(12px + var(--st));transform:translateX(-50%);width:min(340px,70vw);padding:7px 12px;z-index:10;text-align:center;pointer-events:none}
#bossName{font-size:13px;letter-spacing:3px;color:#e8c18a}
#bossTrack{height:8px;background:#160d0b;margin-top:5px;border:1px solid #594330}
#bossFill{height:100%;background:linear-gradient(180deg,#c0623a,#7a2f17);width:100%}
#bossState{font-size:11px;margin-top:4px;color:#b9a486}
#banner{position:fixed;left:50%;top:calc(96px + var(--st));transform:translateX(-50%);text-align:center;z-index:12;pointer-events:none;opacity:0;transition:opacity .5s;width:92vw;text-shadow:0 2px 6px #000,0 0 14px #000}
#banner.show{opacity:1}
#b1{font-size:clamp(20px,3.4vw,32px);letter-spacing:8px;color:#e9d6a2;font-weight:700}
#b2{font-size:13px;letter-spacing:2px;color:#bfae86;margin-top:6px}
#msg{position:fixed;left:50%;top:calc(172px + var(--st));transform:translateX(-50%);font-size:13px;color:#e5cc97;text-shadow:0 2px 4px #000;z-index:12;pointer-events:none;text-align:center}
#hint{position:fixed;left:50%;bottom:calc(98px + var(--sb));transform:translateX(-50%);font-size:12px;letter-spacing:1px;color:#b0a482;opacity:.85;pointer-events:none;z-index:9;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;transition:opacity 1.2s}
#hint.fade{opacity:0}
#skills{position:fixed;left:50%;bottom:calc(16px + var(--sb));transform:translateX(-50%);z-index:10;display:flex;gap:6px;padding:8px}
.skillBtn{position:relative;width:92px;height:60px;padding:14px 4px 5px;font-size:12.5px;touch-action:none;background:linear-gradient(0deg,rgba(16,15,14,.94) var(--cd,0%),rgba(61,52,37,.96) var(--cd,0%))}
.skillBtn small{display:block;color:#e1c68f;font-size:11px;margin-top:4px}
.keycap{position:absolute;left:5px;top:2px;font-size:10px;color:#9e8c65}
.skillBtn.cool{color:#807767}.skillBtn.locked{opacity:.4}
.skillBtn.active{box-shadow:0 0 0 2px #d2b271,inset 0 0 12px rgba(185,131,54,.25)}
#touchUI{display:none}
body.touch #touchUI{display:block}
body.touch #hint{display:none}
#joy{position:fixed;left:0;bottom:var(--sb);width:44vw;height:230px;z-index:8;touch-action:none}
#joyBase{position:absolute;left:calc(22px + var(--sl));bottom:26px;width:116px;height:116px;border-radius:50%;border:2px solid rgba(160,145,105,.5);background:radial-gradient(circle,rgba(30,28,32,.3),rgba(10,10,12,.6));box-shadow:inset 0 0 18px #000,0 0 0 2px rgba(0,0,0,.6)}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#6a6458,#2a2824);border:2px solid var(--ink);box-shadow:0 0 0 1px #8c7c58,0 3px 8px #000}
.tbtn{position:fixed;z-index:8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#eadcb2;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#5a2320,#250c0b);box-shadow:0 0 0 2px #8c7c58,0 4px 12px #000,inset 0 1px 0 rgba(255,220,180,.15);touch-action:none}
#btnAtk{right:calc(18px + var(--sr));bottom:calc(24px + var(--sb));width:78px;height:78px;font-size:26px}
#btnAtk.on{filter:brightness(1.45)}
#btnDodge{right:calc(110px + var(--sr));bottom:calc(24px + var(--sb));width:58px;height:58px;font-size:19px;background:radial-gradient(circle at 35% 30%,#4a4a52,#1b1b20)}
#btnDodge.cd{opacity:.38}
body.touch #skills{left:auto;right:calc(14px + var(--sr));bottom:calc(116px + var(--sb));transform:none;display:grid;grid-template-columns:62px 62px;gap:8px;padding:0;background:none;border:none;box-shadow:none;outline:none}
body.touch #skills::before,body.touch #skills::after{display:none}
body.touch .skillBtn{width:62px;height:56px;border-radius:9px;font-size:12px;padding:8px 1px 3px}
body.touch .keycap{display:none}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20;background:rgba(4,4,6,.72)}
#ovTitle{background:radial-gradient(ellipse at center,rgba(5,5,7,.45) 0%,rgba(4,4,6,.92) 75%)}
#ovForge{background:rgba(6,4,3,.86)}
.card{padding:22px 30px 20px;text-align:center;max-width:94vw;max-height:94vh;overflow:auto;touch-action:pan-y}
h1{margin:0 0 4px;font-size:clamp(30px,6vw,56px);letter-spacing:10px;font-weight:700;background:linear-gradient(180deg,#f1e2b4,#a88c50 55%,#5e4a28);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 8px;font-size:25px;letter-spacing:8px;color:#d9c592}
.sub{font-size:12px;letter-spacing:4px;color:#8f8368;margin-bottom:12px}
.txt{font-size:13.5px;line-height:1.85;color:#b9ad8d;margin:8px 0 12px}
.txt strong{color:#e6d3a0}
.modes{display:flex;gap:8px;justify-content:center;margin:10px 0 12px;flex-wrap:wrap}
#forgeCards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
.rune{position:relative;width:210px;min-height:200px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 12px 12px;text-align:center}
.rune:hover{background:linear-gradient(180deg,#4a4132,#272219);box-shadow:0 0 0 2px #c2a868}
.glyph{width:54px;height:54px;line-height:50px;font-size:28px;color:#f0c98a;border:2px solid #8f7440;transform:rotate(45deg);background:radial-gradient(circle,#5a2a16,#1d0f0a);box-shadow:0 0 14px rgba(220,110,40,.35);margin:8px 0 12px}
.glyph>i{display:block;transform:rotate(-45deg);font-style:normal}
.rune strong{font-size:15px;color:#ecd9a6;letter-spacing:2px}
.rune em{font-style:normal;font-size:11px;color:#b08c54;letter-spacing:1px}
.rd{font-size:12.5px;line-height:1.6;color:#c2b594}
#pauseRunes{font-size:12px;line-height:1.7;color:#b2a283;text-align:left;margin:10px auto;max-width:440px}
#pauseRunes strong{color:#d5bf91}
#endStats{font-size:15px;letter-spacing:1px;line-height:1.9;color:#d6c8a2;margin:6px 0 12px}
@media (max-width:700px),(max-height:480px){
 #hudL{padding:7px 9px 6px;width:min(250px,58vw)}#hudL .row+.row{margin-top:4px}.lbl{letter-spacing:1px;font-size:11px}b{font-size:12.5px}#hpBar{height:12px}
 #hudR{padding:4px 5px;gap:4px}#hudR button{padding:4px 6px;font-size:11.5px}
 .card{padding:14px 16px}h1{letter-spacing:6px}.txt{line-height:1.6;font-size:12.5px}
 button.big{padding:8px 20px;font-size:15px}h2{font-size:21px}
 .rune{width:100%;min-height:0;padding:10px}.glyph{width:40px;height:40px;line-height:36px;font-size:21px;margin:4px 0 8px}
 #bossHud{top:calc(100px + var(--st))}#banner{top:calc(168px + var(--st))}#msg{top:calc(236px + var(--st))}
 .skillBtn{width:21vw;max-width:92px}
}
@media (max-height:480px) and (min-width:701px){#bossHud{top:calc(8px + var(--st));width:240px}#banner{top:calc(74px + var(--st))}#msg{top:calc(130px + var(--st))}body.touch #skills{bottom:calc(98px + var(--sb))}body.touch .skillBtn{height:50px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hudL" class="panel">
  <div class="row"><span class="lbl">生命</span><div id="hpBar"><div id="hpLag"></div><div id="hpFill"></div></div><b id="hpTxt">100</b></div>
  <div class="row"><b id="waveTxt">—</b><i class="sep"></i><span class="lbl">余敌</span><b id="foes">0</b><i class="sep"></i><span class="lbl">斩杀</span><b id="kills">0</b></div>
  <div class="row"><span class="lbl">闪避</span><div id="dgBar"><div id="dgFill"></div></div><span id="runeLine"></span></div>
</div>
<div id="hudR" class="panel"><button id="btnPause">暂停</button><button id="btnSnd">音效：开</button></div>
<div id="bossHud" class="panel hidden"><div id="bossName"></div><div id="bossTrack"><div id="bossFill"></div></div><div id="bossState"></div></div>
<div id="banner"><div id="b1"></div><div id="b2"></div></div>
<div id="msg"></div>
<div id="hint"></div>
<div id="skills" class="panel"></div>
<div id="touchUI"><div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div><div id="btnDodge" class="tbtn">避</div><div id="btnAtk" class="tbtn">斩</div></div>

<div id="ovTitle" class="overlay"><div class="card panel">
  <h1>符炉远征</h1>
  <div class="sub">RUNEFORGE EXPEDITION · 骸原铁誓</div>
  <div class="txt"><strong>目标：</strong>连破七波亡骨，在第八波击碎「炉心骸王」。<br>每破一波，符炉开启——<strong>三枚符文任选其一</strong>，新战技与强化由你决定。<br>倒下即止步，远征从头再来。</div>
  <div class="txt dim">键鼠：WASD 移动 · 鼠标瞄准 · 左键挥斩 · 空格闪避 · 1–4 战技 · P 暂停<br>触屏：左摇杆移动 · 斩 / 避 · 战技自动瞄准最近敌人</div>
  <div class="modes"><button class="modeBtn" data-mode="kb">键鼠操作</button><button class="modeBtn" data-mode="touch">触屏操作</button></div>
  <button id="btnStart" class="big">踏入远征</button><button id="btnOathT" class="big hidden"></button>
  <div class="dim" id="bestTxt" style="margin-top:8px"></div>
</div></div>

<div id="ovPause" class="overlay hidden"><div class="card panel">
  <h2>暂 停</h2>
  <div class="txt" id="pauseWhy"></div>
  <div id="pauseRunes"></div>
  <button id="btnResume" class="big">继续</button><button id="btnRestartP" class="big">重新开始</button>
  <div class="modes"><button id="btnMode">操作：键鼠</button><button id="btnShake">震动：开</button></div>
</div></div>

<div id="ovForge" class="overlay hidden"><div class="card panel">
  <h2>符 炉</h2>
  <div class="txt" id="forgeSub"></div>
  <div id="forgeCards"></div>
  <div class="dim">点击或按 1 / 2 / 3 选择一枚符文，随后下一波立即开始</div>
</div></div>

<div id="ovEnd" class="overlay hidden"><div class="card panel">
  <h2 id="endTitle"></h2>
  <div id="endStats"></div>
  <button id="btnAgain" class="big">再次远征</button><button id="btnOath" class="big hidden"></button>
</div></div>

<script>
/* 符炉远征 — 独立候选。基于《骸原铁誓》战技试炼 V0.2.2 的 Canvas / WebAudio 程序化素材与战斗内核重组。
   单文件、无外部依赖、无网络请求。全部画面与音效均为代码生成。 */
(()=>{
'use strict';
/* ================= 1. 配置 ================= */
const CFG={
  world:{w:4000,h:3000,chunk:400,cell:50,res:1.5,maxChunks:36},
  view:{base:560,minBase:.95},loop:{maxDt:.05,stall:.5},
  hero:{r:15,speed:176,blade:60,hipZ:9,bodyZ:17,headZ:27},
  atk:{windup:.16,windupChain:.12,swing:.14,recover:.28,chainAt:.1,dmgMin:30,dmgMax:42,lunge:170,buffer:.2},
  dodge:{time:.26,speed:520,inv:.24},
  enemy:{maxAttackers:3,arc:1.0,reach:24,bruteReach:30,dieTime:.36,maxShooters:2,maxProjectiles:30},
  fx:{maxParticles:220,maxDebris:150,maxNumbers:40,maxTrail:90,maxFlashes:12,maxVoices:48,maxSkillFx:24,stopHit:.045,stopCrit:.075,stopKill:.06,stopCap:.13}
};
const ORDER=['shock','cleave','whirl','leap'];
const SKILLS={
  shock:{name:'震荡波',key:'1',cd:6,windup:.2,recover:.24,range:160,halfAngle:Math.PI/3,damage:26,stun:1.05,knockback:120},
  cleave:{name:'破甲重斩',key:'2',cd:7,windup:.5,active:.12,recover:.32,range:130,halfAngle:.38,damage:82,armoredMul:1.45,controlledMul:1.25,breakTime:3,stun:.32,knockback:430},
  whirl:{name:'旋风斩',key:'3',cd:9,windup:.15,duration:1.5,recover:.2,range:78,tick:.25,damage:18,move:.58,knockback:35},
  leap:{name:'跃击',key:'4',cd:8,windup:.18,flight:.48,recover:.2,distance:240,minDistance:40,range:80,damage:45,stun:.25,knockback:230}
};
const cloneSkills=()=>JSON.parse(JSON.stringify(SKILLS));
let SK=cloneSkills();
const baseStats=()=>({dmg:1,skill:1,crit:.12,critMul:1.75,maxHp:100,heal:2,speed:1,dodgeCd:.8,third:0,guard:0,thorn:0,leech:0,reset:false,has:{shock:true,cleave:true,whirl:false,leap:false}});
/* 符文：fn(S,h) 直接改写本局属性 S 或本局技能表 SK */
const RUNES=[
  {id:'whirl',glyph:'旋',name:'战技 · 旋风斩',max:1,unlock:'whirl',desc:'解锁 [3]：旋转 1.5 秒持续切割四周，期间可移动。清理杂兵的利器。'},
  {id:'leap',glyph:'跃',name:'战技 · 跃击',max:1,unlock:'leap',desc:'解锁 [4]：跃向瞄准落点，腾空无敌，落地冲击并短暂震晕。切入弓手或脱困。'},
  {id:'edge',glyph:'刃',name:'锻刃符',max:3,desc:'普攻伤害 +20%。',fn:S=>{S.dmg+=.2;}},
  {id:'fury',glyph:'怒',name:'炉怒符',max:3,desc:'所有战技伤害 +25%。',fn:S=>{S.skill+=.25;}},
  {id:'crit',glyph:'隙',name:'裂隙符',max:3,desc:'普攻暴击率 +10%，暴击伤害 +25%。',fn:S=>{S.crit+=.1;S.critMul+=.25;}},
  {id:'third',glyph:'叠',name:'三叠符',max:2,desc:'每第三次普攻化为重击：伤害 +80%，击退加倍。',fn:S=>{S.third+=.8;}},
  {id:'vit',glyph:'躯',name:'铁躯符',max:3,desc:'生命上限 +25，并立即回复 25。',fn:(S,h)=>{S.maxHp+=25;h.hp+=25;}},
  {id:'blood',glyph:'血',name:'渴血符',max:3,desc:'每次斩杀额外回复 2 点生命。',fn:S=>{S.heal+=2;}},
  {id:'ember',glyph:'烧',name:'赤烧符',max:2,desc:'受到的伤害 −12%；受击时爆燃，灼伤并击退身边敌人（30 点）。',fn:S=>{S.guard+=.12;S.thorn+=30;}},
  {id:'swift',glyph:'疾',name:'疾行符',max:2,desc:'移动速度 +10%，闪避冷却 −25%。',fn:S=>{S.speed+=.1;S.dodgeCd*=.75;}},
  {id:'haste',glyph:'息',name:'炉息符',max:2,desc:'所有战技冷却 −18%。',fn:()=>{for(const id of ORDER)SK[id].cd*=.82;}},
  {id:'quake',glyph:'震',name:'裂地符',max:2,need:'shock',desc:'震荡波范围 +30%，眩晕 +0.5 秒。',fn:()=>{SK.shock.range*=1.3;SK.shock.stun+=.5;}},
  {id:'exec',glyph:'决',name:'处决符',max:2,need:'cleave',desc:'破甲重斩伤害 +40%；以它击杀时立即重置其冷却。',fn:S=>{SK.cleave.damage*=1.4;S.reset=true;}},
  {id:'gale',glyph:'岚',name:'血旋符',max:2,need:'whirl',desc:'旋风斩延长 0.5 秒；每轮切中敌人回复 1 点生命。',fn:S=>{SK.whirl.duration+=.5;S.leech+=1;}},
  {id:'meteor',glyph:'陨',name:'陨坠符',max:2,need:'leap',desc:'跃击冲击范围 +30%，伤害 +50%。',fn:()=>{SK.leap.range*=1.3;SK.leap.damage*=1.5;}}
];
/* 波次：m 骸卒 / a 弓手 / b 重甲 / e 精英 */
const WAVES=[
  {name:'灰土初醒',tip:'左键连斩 · 空格闪避 · 1 震荡波 · 2 破甲重斩',m:6,cap:5},
  {name:'骨矢',tip:'弓手拉弓时有瞄准线——侧移或闪避',m:7,a:2,cap:6},

/* ================= 2. 工具 ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const easeOut=t=>1-(1-t)*(1-t)*(1-t);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rot=(x,y,a)=>{const c=Math.cos(a),s=Math.sin(a);return[x*c-y*s,x*s+y*c];};
function hashI(i,j,p){return(Math.imul(i,73856093)^Math.imul(j,19349663)^Math.imul(p|0,83492791))>>>0;}
function hash2(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function vnoise(x,y){const ix=Math.floor(x),iy=Math.floor(y);let fx=x-ix,fy=y-iy;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);
  const a=hash2(ix,iy),b=hash2(ix+1,iy),c=hash2(ix,iy+1),d=hash2(ix+1,iy+1);return lerp(lerp(a,b,fx),lerp(c,d,fx),fy);}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy||1e-6;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l2,0,1);const cx=ax+dx*t,cy=ay+dy*t;return{d:Math.hypot(px-cx,py-cy),x:cx,y:cy};}
function elbow(x1,y1,x2,y2,l1,l2,sg){const dx=x2-x1,dy=y2-y1,d=Math.hypot(dx,dy)||1e-4;const dm=Math.min(d,l1+l2-.01);const a=(l1*l1-l2*l2+dm*dm)/(2*dm);const hh=Math.sqrt(Math.max(0,l1*l1-a*a));const ux=dx/d,uy=dy/d;return[x1+ux*a-uy*hh*sg,y1+uy*a+ux*hh*sg];}

/* ================= 3. 音频（WebAudio 程序化） ================= */
const Sfx=(()=>{
  let ac=null,master=null,nbuf=null,muted=false,wantSuspend=false;const volume=.65;
  const live=new Map(),last={};
  function resume(){if(!ac||wantSuspend)return;try{const p=ac.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  function halt(){try{const p=ac.suspend();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  function unlock(){
    if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      try{ac=new AC();master=ac.createGain();master.gain.value=muted?0:volume;
        const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;master.connect(comp);comp.connect(ac.destination);
        nbuf=ac.createBuffer(1,Math.floor(ac.sampleRate*1.5),ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
        startAmb();}catch(err){ac=null;return;}}
    if(wantSuspend){if(ac.state==='running')halt();}else if(ac.state!=='running')resume();
  }
  function startAmb(){const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=230;
    const g=ac.createGain();g.gain.value=.045;const lfo=ac.createOscillator();lfo.frequency.value=.07;const lg=ac.createGain();lg.gain.value=70;
    lfo.connect(lg);lg.connect(f.frequency);s.connect(f);f.connect(g);g.connect(master);s.start();lfo.start();}
  function releaseVoice(src,nodes){src.onended=null;live.delete(src);try{src.disconnect();}catch(_){}for(const n of nodes)try{n.disconnect();}catch(_){}}
  function clearVoices(){for(const[src,nodes]of live){try{src.stop();}catch(_){}releaseVoice(src,nodes);}live.clear();for(const k in last)delete last[k];}
  function keep(src,...nodes){live.set(src,nodes);src.onended=()=>releaseVoice(src,nodes);}
  function env(g,t,vol,atk,dur){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
  function noise(o){if(live.size>=CFG.fx.maxVoices)return;const t=ac.currentTime+(o.at||0);const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;
    const f=ac.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f0,t);if(o.f1)f.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);f.Q.value=o.q||1;
    const g=ac.createGain();env(g,t,o.vol,o.atk||.004,o.dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+o.dur+.03);keep(s,g,f);}
  function tone(o){if(live.size>=CFG.fx.maxVoices)return;const t=ac.currentTime+(o.at||0);const os=ac.createOscillator();os.type=o.type||'sine';
    os.frequency.setValueAtTime(o.f0,t);if(o.f1)os.frequency.exponentialRampToValueAtTime(o.f1,t+o.dur);
    const g=ac.createGain();env(g,t,o.vol,o.atk||.004,o.dur);os.connect(g);g.connect(master);os.start(t);os.stop(t+o.dur+.03);keep(os,g);}
  function ok(name,gap){if(!ac||muted||ac.state!=='running')return false;const t=ac.currentTime;if(last[name]!==undefined&&t-last[name]<gap)return false;last[name]=t;return true;}
  return{unlock,
    setMuted(m){muted=m;if(m)clearVoices();if(master)master.gain.value=m?0:volume;},
    isMuted(){return muted;},
    suspend(b){wantSuspend=b;if(b)clearVoices();if(!ac)return;if(b)halt();else resume();},
    stopAll(){clearVoices();},
    swing(){if(!ok('sw',.05))return;const p=rand(.92,1.1);noise({dur:.2,f0:380*p,f1:2600*p,q:1.1,vol:.34,atk:.055});noise({dur:.15,type:'lowpass',f0:520,f1:190,vol:.13,atk:.03});},
    hit(crit,kill,brute){if(!ok('hit',.025))return;const p=rand(.9,1.12);
      tone({f0:165*p,f1:48,dur:.13,vol:crit?.68:.5});noise({dur:.065,f0:1900*p,f1:700,q:.8,vol:crit?.46:.36,atk:.002});noise({dur:.03,type:'highpass',f0:3800,vol:.16,atk:.001});
      if(brute)tone({type:'triangle',f0:840*p,f1:780,dur:.16,vol:.06});
      if(crit){tone({type:'triangle',f0:1180*p,f1:1040,dur:.28,vol:.1});tone({type:'square',f0:2380*p,dur:.1,vol:.025});tone({f0:82,f1:36,dur:.24,vol:.4});}
      if(kill){for(let i=0;i<4;i++)noise({at:.05+i*.06+Math.random()*.02,dur:.04,f0:rand(1400,3200),q:7,vol:.2,atk:.002});tone({at:.02,f0:95,f1:40,dur:.2,vol:.28});}},
    step(){if(!ok('st',.12))return;noise({dur:.06,type:'lowpass',f0:rand(200,280),vol:.13,atk:.003});noise({dur:.025,f0:rand(3400,4200),q:4,vol:.022,atk:.002});},
    hurt(){if(!ok('hu',.08))return;tone({type:'sawtooth',f0:170,f1:70,dur:.2,vol:.22});noise({dur:.13,type:'lowpass',f0:900,f1:300,vol:.38,atk:.002});tone({type:'triangle',f0:760,f1:700,dur:.12,vol:.06});},
    enemySwing(){if(!ok('es',.06))return;noise({dur:.13,f0:380,f1:1300,q:1,vol:.13,atk:.04});},
    warn(){if(!ok('wn',.25))return;tone({type:'sawtooth',f0:62,f1:92,dur:.5,vol:.16,atk:.12});noise({dur:.45,type:'lowpass',f0:160,f1:420,vol:.14,atk:.15});},
    dodge(){if(!ok('dg',.1))return;noise({dur:.22,f0:300,f1:1300,q:.7,vol:.2,atk:.05});},
    clank(){if(!ok('ck',.1))return;tone({type:'triangle',f0:1500,f1:1380,dur:.3,vol:.1});tone({type:'square',f0:2900,dur:.08,vol:.03});noise({dur:.05,f0:2600,q:2,vol:.18,atk:.001});},
    boom(){if(!ok('bm',.08))return;tone({f0:120,f1:34,dur:.4,vol:.6});noise({dur:.3,type:'lowpass',f0:700,f1:120,vol:.4,atk:.004});},
    rune(){if(!ok('rn',.1))return;tone({type:'triangle',f0:392,dur:.5,vol:.12});tone({type:'triangle',f0:587,dur:.6,vol:.1,at:.09});noise({dur:.5,type:'lowpass',f0:300,f1:900,vol:.08,atk:.2});},
    win(){if(!ok('wi',1))return;[196,247,294,392].forEach((f,i)=>tone({type:'triangle',f0:f,dur:1.4,vol:.13,at:i*.16}));tone({f0:98,f1:49,dur:2,vol:.3});},
    death(){if(!ok('de',.5))return;tone({f0:110,f1:38,dur:1.6,vol:.5,atk:.02});noise({dur:1.2,type:'lowpass',f0:500,f1:80,vol:.25,atk:.02});tone({type:'triangle',f0:220,f1:55,dur:1.4,vol:.12});},
    ui(){if(!ok('ui',.05))return;tone({type:'triangle',f0:520,f1:420,dur:.07,vol:.08});}
  };
})();

/* ================= 4. 输入（键鼠 / 触屏） ================= */
const Input=(()=>{
  const keys=new Set();
  const st={mode:'kb',mx:innerWidth/2,my:innerHeight/2,lmb:false,jx:0,jy:0,joyId:null,atk:false,atkId:null,dodgeQ:false,skillQ:null};
  let knobEl=null,atkEl=null;
  const cap=(el,id)=>{try{el.setPointerCapture(id);}catch(_){}} ;
  function reset(){
    keys.clear();st.lmb=false;st.jx=st.jy=0;st.joyId=null;st.atk=false;st.atkId=null;st.dodgeQ=false;st.skillQ=null;
    if(G.hero){G.hero.buffer=0;G.hero.sq=null;}
    if(knobEl)knobEl.style.transform='translate(-50%,-50%)';if(atkEl)atkEl.classList.remove('on');
  }
  function init(o){
    const cv=o.canvas,joy=o.joy,base=o.joyBase,dodgeEl=o.dodge;knobEl=o.knob;atkEl=o.atk;
    addEventListener('keydown',e=>{
      o.onAction();const c=e.code||'';
      if(e.metaKey||e.ctrlKey||e.altKey){reset();return;}
      if(c==='Space'||c==='Tab'||/^Digit[1-4]$/.test(c)||c.startsWith('Arrow'))e.preventDefault();
      if(e.repeat)return;keys.add(c);
      if(c==='Space'||c==='ShiftLeft'||c==='ShiftRight')st.dodgeQ=true;
      o.onKey(c);
    });
    addEventListener('keyup',e=>{const c=e.code||'';keys.delete(c);if(c.startsWith('Meta')||c.startsWith('Alt')||c.startsWith('Control'))keys.clear();});
    cv.addEventListener('mousedown',e=>{o.onAction();e.preventDefault();try{window.focus();}catch(_){}st.mx=e.clientX;st.my=e.clientY;if(e.button===0)st.lmb=true;});
    addEventListener('mouseup',e=>{if(e.button===0)st.lmb=false;});
    addEventListener('mousemove',e=>{if(e.target===cv||st.lmb){st.mx=e.clientX;st.my=e.clientY;}if(!(e.buttons&1))st.lmb=false;});
    addEventListener('contextmenu',e=>e.preventDefault());addEventListener('dragstart',e=>e.preventDefault());
    cv.addEventListener('touchstart',e=>{o.onAction();e.preventDefault();},{passive:false});
    const moveJoy=e=>{const r=base.getBoundingClientRect(),R=r.width/2||1;let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const l=Math.hypot(dx,dy);
      if(l>R){dx*=R/l;dy*=R/l;}st.jx=dx/R;st.jy=dy/R;knobEl.style.transform='translate(calc(-50% + '+dx.toFixed(1)+'px),calc(-50% + '+dy.toFixed(1)+'px))';};
    const endJoy=e=>{if(e.pointerId!==st.joyId)return;st.joyId=null;st.jx=st.jy=0;knobEl.style.transform='translate(-50%,-50%)';};
    joy.addEventListener('pointerdown',e=>{o.onAction();e.preventDefault();if(st.joyId!==null)return;st.joyId=e.pointerId;cap(joy,e.pointerId);moveJoy(e);});
    joy.addEventListener('pointermove',e=>{if(e.pointerId===st.joyId)moveJoy(e);});
    joy.addEventListener('pointerup',endJoy);joy.addEventListener('pointercancel',endJoy);joy.addEventListener('lostpointercapture',endJoy);
    const endAtk=e=>{if(e.pointerId!==st.atkId)return;st.atkId=null;st.atk=false;atkEl.classList.remove('on');};
    atkEl.addEventListener('pointerdown',e=>{o.onAction();e.preventDefault();if(st.atkId!==null)return;st.atk=true;st.atkId=e.pointerId;atkEl.classList.add('on');cap(atkEl,e.pointerId);});
    atkEl.addEventListener('pointerup',endAtk);atkEl.addEventListener('pointercancel',endAtk);atkEl.addEventListener('lostpointercapture',endAtk);
    dodgeEl.addEventListener('pointerdown',e=>{o.onAction();e.preventDefault();st.dodgeQ=true;});
    const lose=()=>{reset();o.onBlur();},gain=()=>{reset();o.onFocus();};
    addEventListener('blur',lose);addEventListener('pagehide',lose);document.addEventListener('freeze',lose);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)lose();else gain();});
    addEventListener('focus',gain);addEventListener('pageshow',gain);
  }
  return{st,keys,reset,init};
})();

/* —— 统一命中结算：普攻（ev.damage 未定义）与战技共用 —— */
function hitEnemy(e,cx,cy,tgx,tgy,ev={}){
  if(e.dead||e.dying)return;
  const h=G.hero,S=G.S,F=CFG.fx,basic=ev.damage===undefined;
  const crit=basic&&Math.random()<S.crit,impact=crit||!!ev.heavy;
  const raw=basic?rand(CFG.atk.dmgMin,CFG.atk.dmgMax)*S.dmg*h.swingBonus:ev.damage;
  const armor=ev.pierce||e.armorBreak>0?0:e.armor;
  const dmg=Math.max(1,Math.round(raw*(crit?S.critMul:1)*(1-armor)*(e.exposed>0?1.2:1)));
  e.hp-=dmg;
  const rx=e.x-h.x,ry=e.y-h.y,rl=Math.hypot(rx,ry)||1;
  let kx=rx/rl*.7+tgx*.3,ky=ry/rl*.7+tgy*.3;const kl=Math.hypot(kx,ky)||1;kx/=kl;ky/=kl;
  const kb=(basic?320*(crit?1.3:1)*(ev.heavy?2:1):(ev.knockback||0))*e.kbm;
  if(kb>0){e.kx=kx*kb;e.ky=ky*kb;e.kdx=kx;e.kdy=ky;}
  e.flash=ev.quiet?.035:(impact?.1:.07);e.leanX=kx*(ev.quiet?2:12);e.leanY=ky*(ev.quiet?2:12);e.recoil=ev.quiet?.2:1;e.stunTw=-h.side*rand(.45,.8);
  const kill=e.hp<=0,px=(cx+e.x)/2,py=(cy+e.y)/2-15*e.scale;
  if(G.flashes.length>=F.maxFlashes)G.flashes.shift();
  G.flashes.push({x:px,y:py,age:0,life:impact?.13:.08,size:ev.quiet?6:impact?20:11,ang:Math.atan2(tgy,tgx),crit:impact});
  const nc=ev.quiet?1:impact?9:5;
  for(let i=0;i<nc;i++){const v=rand(110,260),rv=rand(10,110),ja=rand(-.5,.5),c=Math.cos(ja),s=Math.sin(ja);
    addP({type:'chip',x:px,y:py+15,z:15,vx:(tgx*c-tgy*s)*v+kx*rv,vy:(tgx*s+tgy*c)*v+ky*rv,vz:rand(30,150),age:0,life:rand(.45,.75),rot:rand(0,TAU),rv:rand(-20,20),size:rand(1.4,2.6)});}
  const ns=ev.quiet?0:impact?5:(e.brute?2:0);
  for(let i=0;i<ns;i++){const a=Math.atan2(tgy,tgx)+rand(-.9,.9),v=rand(260,480);addP({type:'spark',x:px,y:py+15,z:15,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vz:0,age:0,life:rand(.1,.18)});}
  if(!ev.quiet)dust(e.x-kx*6,e.y-ky*6,2,30);
  addNumber(e.x,e.y-52*e.scale,dmg,impact?'c':'n');
  if(!ev.quiet){
    let stop=impact?F.stopCrit:F.stopHit;if(kill)stop=Math.max(stop,F.stopKill);stop=Math.min(stop,F.stopCap-h.swingStop);
    if(stop>0){h.swingStop+=stop;G.hitStop=Math.max(G.hitStop,stop);}
    addShake(impact?.6:.34,tgx*(impact?4.5:2.4),tgy*(impact?4.5:2.4));Sfx.hit(impact,kill,e.brute);
  }
  if(kill){
    e.kx*=1.15;e.ky*=1.15;killEnemy(e,impact?1.25:1);
    G.kills++;heal(S.heal*(e.elite?5:1));
    if(ev.id==='cleave'&&S.reset)h.cooldowns.cleave=0;
    if(e.boss)win();
    return;
  }
  if(e.boss&&e.sum<2&&e.hp<e.maxHp*(e.sum?.33:.66)){
    e.sum++;for(let i=0;i<4;i++)G.queue.push('melee');
    if(e.sum>1)G.queue.push('archer','archer');else G.queue.push('brute');

function sweepHit(h,sg){

/* —— 战技 —— */
function withinSector(x,y,r,ox,oy,range,ang,half){
  const d=Math.hypot(x-ox,y-oy),delta=Math.abs(angDiff(ang,Math.atan2(y-oy,x-ox)));
  if(d<=r)return true;if(delta<=half)return d<=range+r;
  const a=ang-half,b=ang+half;
  return Math.min(segDist(x,y,ox,oy,ox+Math.cos(a)*range,oy+Math.sin(a)*range).d,segDist(x,y,ox,oy,ox+Math.cos(b)*range,oy+Math.sin(b)*range).d)<=r;
}
function applyControl(e,duration){
  if(e.dead||e.dying||duration<=0||(e.elite&&e.controlGuard>0)||e.state==='bossLeap')return false;
  const t=duration*(e.boss?.35:e.elite?.55:1);
  if(e.state==='stun'&&e.dur-e.t>=t)return false;
  e.state='stun';e.t=0;e.dur=t;e.combo=0;e.struck=true;
  if(e.elite)e.controlGuard=t+(e.boss?4:2.4);
  return true;
}
function safePath(o,x,y,maxDist){
  const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy),limit=Math.min(maxDist,d);
  let target={x:o.x,y:o.y,distance:0};
  if(!Number.isFinite(d)||d<.001)return target;
  const steps=Math.max(1,Math.ceil(limit/4));
  for(let i=1;i<=steps;i++){const t=limit*i/steps,nx=o.x+dx/d*t,ny=o.y+dy/d*t;if(!World.walkable(nx,ny,o.r+1))break;target={x:nx,y:ny,distance:t};}
  return target;
}
function cancelCast(){
  const h=G.hero;if(!h.cast)return;
  h.cast=null;h.jumpZ=0;h.autoAim=null;h.buffer=0;h.lunge=0;h.phase='recover';h.pt=0;h.pdur=.18;h.chainAt=.18;h.from=copyPose(h.pose);
}
/* 返回 true = 已处理（施放或明确拒绝）；false = 动作占用中，可继续缓冲 */
function castSkill(id,aim){
  const h=G.hero,S=SK[id];
  if(!S||!G.S.has[id]||G.state!=='play'||G.paused||h.dead||!aim||!Number.isFinite(aim.ang))return true;
  if(h.cooldowns[id]>.001){notice(S.name+' 冷却中 '+h.cooldowns[id].toFixed(1)+' 秒');return true;}
  if(h.dodgeT>0||h.cast||h.phase==='windup'||h.phase==='swing')return false;
  let landing=null,ang=aim.ang;
  if(id==='leap'){landing=safePath(h,aim.x,aim.y,S.distance);if(landing.distance<S.minDistance){notice('落点太近或被挡住');return true;}ang=Math.atan2(landing.y-h.y,landing.x-h.x);}
  h.cooldowns[id]=S.cd;h.buffer=0;h.autoAim=null;h.lunge=0;h.swingStop=0;
  h.cast={id,t:0,ang,x:h.x,y:h.y,from:copyPose(h.pose),windup:S.windup,did:false,ticks:0,landing};
  h.phase='skill';h.bodyAng=h.aim=h.headAng=ang;h.vx*=.35;h.vy*=.35;if(id==='leap')h.vx=h.vy=0;

function strikeArea(id,a,ox,oy){
  const S=SK[id];let any=false;

    if(e.dead||e.dying||(e.state==='spawn'&&e.t<e.dur*.35))continue;
    const dx=e.x-ox,dy=e.y-oy,d=Math.hypot(dx,dy)||1;
    const inside=S.halfAngle!==undefined?withinSector(e.x,e.y,e.r,ox,oy,S.range,a.ang,S.halfAngle):d<=S.range+e.r;
    if(!inside||!World.clearSegment(ox,oy,e.x,e.y,1))continue;
    let damage=S.damage*G.S.skill;

    any=true;
    hitEnemy(e,e.x,e.y,dx/d,dy/d,{id,damage,knockback:S.knockback||0,stun:S.stun||0,heavy:id==='cleave'||id==='leap',quiet:id==='whirl',pierce:id==='cleave'});

function moveDuringSkill(h,dt,c,mul){

function finishCast(h,recover){h.cast=null;h.jumpZ=0;h.phase='recover';h.pt=0;h.pdur=recover;h.chainAt=recover;h.from=copyPose(h.pose);h.autoAim=null;}
function updateCast(h,dt,c){

}
function updateCloak(h,dt){
  let target=h.bodyAng+Math.PI+h.pose.tw*.4;const sp=Math.hypot(h.vx,h.vy);
  if(sp>40)target+=angDiff(target,Math.atan2(-h.vy,-h.vx))*clamp(sp/260,0,.6);

function updateHero(dt,c){
  const h=G.hero,A=CFG.atk,S=G.S,SP=CFG.hero.speed*S.speed;
  if(h.dead){
    h.deadT+=dt;const f=Math.exp(-dt*6);h.vx*=f;h.vy*=f;h.x+=h.vx*dt;h.y+=h.vy*dt;World.collide(h,h.r);
    if(h.deadT>.25){const tg=Math.abs(angDiff(h.bodyAng,h.fallAng))<Math.PI/2?h.fallAng:h.fallAng+Math.PI;
      h.bodyAng+=angDiff(h.bodyAng,tg)*Math.min(1,dt*4);h.headAng+=angDiff(h.headAng,h.bodyAng+.55)*Math.min(1,dt*4);}
    const s=h.sword;
    if(s){s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;s.vz-=420*dt;s.ang+=s.rv*dt;
      if(s.z<=0){if(!s.landed){s.landed=true;Sfx.clank();dust(s.x,s.y,2,20);}s.z=0;s.vz=0;const k=Math.exp(-dt*10);s.vx*=k;s.vy*=k;s.rv*=k;}}

  if(c.skill&&!c.dodge)h.sq={id:c.skill.id,aim:c.skill.aim,t:.3};
  if(h.cast&&c.dodge&&h.dodgeCd<=0){const a=h.cast;if(a.id!=='leap'||a.t<a.windup)cancelCast();}
  if(h.sq){h.sq.t-=dt;if(castSkill(h.sq.id,h.sq.aim)||h.sq.t<=0)h.sq=null;}

    let dx,dy;if(ml>.25){dx=mx/ml;dy=my/ml;}else{dx=-Math.cos(h.bodyAng);dy=-Math.sin(h.bodyAng);}
    h.dodgeT=CFG.dodge.time;h.dodgeCd=S.dodgeCd;h.ddx=dx;h.ddy=dy;h.inv=Math.max(h.inv,CFG.dodge.inv);h.dodgeInv=CFG.dodge.inv;
    if(h.phase!=='idle'){h.phase='recover';h.pt=0;h.pdur=.2;h.chainAt=.2;h.from=copyPose(h.pose);}
    h.buffer=0;h.sq=null;Sfx.dodge();dust(h.x,h.y,4,50);

  h.bodyAng+=angDiff(h.bodyAng,aim)*Math.min(1,dt*turn);h.headAng+=angDiff(h.headAng,aim)*Math.min(1,dt*20);

    const chain=h.phase==='recover';
    h.phase='windup';h.pt=0;h.pdur=chain?A.windupChain:A.windup;h.from=copyPose(h.pose);h.buffer=0;h.hits.clear();h.swingStop=0;h.autoAim=null;
    if(c.aim===null){let best=150,be=null;for(const e of G.enemies){if(e.dying||e.dead)continue;const d=Math.hypot(e.x-h.x,e.y-h.y);if(d<best){best=d;be=e;}}if(be)h.autoAim=Math.atan2(be.y-h.y,be.x-h.x);}

      for(let i=1;i<=n;i++){const tt=lerp(t0,t1,i/n);swingPose(p,h.side,tt);const sg=bladeSeg(h,p);

/* —— 敌人 —— */
function viewportBounds(){const a=s2w(0,0),b=s2w(View.cw,View.ch);return{x0:Math.min(a[0],b[0]),y0:Math.min(a[1],b[1]),x1:Math.max(a[0],b[0]),y1:Math.max(a[1],b[1])};}
function visibleForAttack(e,margin=32){const p=w2s(e.x,e.y);return p[0]>=margin&&p[0]<=View.cw-margin&&p[1]>=margin+40&&p[1]<=View.ch-margin;}
function findSpawnPoint(radius,minD){
  const b=viewportBounds(),h=G.hero,start=Math.random()*64|0;
  const free=(x,y)=>World.walkable(x,y,radius+3)&&Math.hypot(x-h.x,y-h.y)>=minD&&!G.enemies.some(e=>!e.dead&&Math.hypot(e.x-x,e.y-y)<e.r+radius+12);
  for(let i=0;i<384;i++){
    const ring=Math.floor(i/64),k=(i+start)%64,pad=95+ring*72,side=k%4,u=((k>>2)+.5)/16;let x,y;
    if(side===0){x=b.x0-pad;y=lerp(b.y0,b.y1,u);}else if(side===1){x=b.x1+pad;y=lerp(b.y0,b.y1,u);}
    else if(side===2){x=lerp(b.x0,b.x1,u);y=b.y0-pad;}else{x=lerp(b.x0,b.x1,u);y=b.y1+pad;}
    if(free(x,y)&&World.clearSegment(x,y,h.x,h.y,radius+2))return{x,y};
  }
  for(let i=0;i<60;i++){   // 兜底：放宽视线要求，最后阶段允许视野内，保证波次不会卡死
    const a=rand(0,TAU),d=rand(minD,minD+420),x=h.x+Math.cos(a)*d,y=h.y+Math.sin(a)*d;
    if(free(x,y)&&(i>30||x<b.x0||x>b.x1||y<b.y0||y>b.y1))return{x,y};
  }
  return null;
}
function makeEnemy(type,x,y){

    face:Math.atan2(G.hero.y-y,G.hero.x-x),state:'spawn',t:0,dur:.6,walk:rand(0,TAU),kx:0,ky:0,kdx:0,kdy:0,flash:0,leanX:0,leanY:0,recoil:0,stunTw:0,

function updateArcher(e,dt){

function eliteShape(e){const b=e.boss;return e.combo===1?{circle:true,range:b?125:92,half:Math.PI}:{circle:false,range:b?145:105,half:b?.9:.8};}
function beginEliteWind(e,combo){

function updateElite(e,dt,attackers){
  const h=G.hero,dx=h.x-e.x,dy=h.y-e.y,d=Math.hypot(dx,dy)||1,toH=Math.atan2(dy,dx),p2=e.boss&&e.hp<e.maxHp*.5,speed=e.speed*(p2?1.2:1),reach=e.r+63;

    case 'chase':

        const p=safePath(e,h.x,h.y,460);

        e.leapCd=1.5;
      }
      if(d>reach){e.x+=dx/d*speed*dt;e.y+=dy/d*speed*dt;e.walk+=dt*speed*.16;}
      else if(e.atkCd<=0&&attackers<CFG.enemy.maxAttackers){beginEliteWind(e,0);return 1;}
      break;
    case 'eliteWind':

      if(e.t>=e.dur){e.state='eliteStrike';e.t=0;e.dur=.18;e.struck=false;Sfx.enemySwing();}

          Sfx.boom();
        }else{

          addSkillFx({type:sh.circle?'ring':'sector',x:e.x,y:e.y,range:sh.range,ang:e.face,half:sh.half,color:'#cb6748',life:.25});
          if(sh.circle){Sfx.boom();addShake(.4,0,3);dust(e.x,e.y,6,90);}
        }
      }

        if(e.combo===0||(e.combo===1&&p2)){e.state='eliteGap';e.t=0;e.dur=.32;}
        else{e.state='eliteRest';e.t=0;e.dur=e.boss?1.2:1.4;e.exposed=e.dur;}
      }
      break;}
    case 'eliteGap':e.t+=dt;if(e.t>=e.dur)beginEliteWind(e,e.combo+1);break;
    case 'eliteRest':e.t+=dt;if(e.t>=e.dur){e.state='chase';e.atkCd=.5;e.combo=0;}break;
    case 'bossLeap':{
      e.t+=dt;const q=clamp(e.t/e.dur,0,1),m=clamp((q-.35)/.65,0,1);
      e.x=lerp(e.sx,e.tx,easeIO(m));e.y=lerp(e.sy,e.ty,easeIO(m));e.jz=Math.sin(m*Math.PI)*60;
      if(q>=1){
        e.jz=0;if(Math.hypot(h.x-e.x,h.y-e.y)<=115+h.r)hurtHero(26*e.dm,e.x,e.y);
        addSkillFx({type:'ring',x:e.x,y:e.y,range:115,color:'#cb6748',life:.3});dust(e.x,e.y,10,110);Sfx.boom();addShake(.7,0,5);
        if(e.state==='bossLeap'){e.state='eliteRest';e.t=0;e.dur=1;e.exposed=1;}
      }
      break;}
    default:e.state='chase';
  }

}
function segmentCircleT(ax,ay,bx,by,cx,cy,r){
  const vx=bx-ax,vy=by-ay,ox=ax-cx,oy=ay-cy,A=vx*vx+vy*vy,C=ox*ox+oy*oy-r*r;
  if(C<=0)return 0;if(A<.000001)return Infinity;
  const B=2*(ox*vx+oy*vy),D=B*B-4*A*C;if(D<0)return Infinity;
  const t=(-B-Math.sqrt(D))/(2*A);return t>=0&&t<=1?t:Infinity;
}
function updateProjectiles(dt){
  const h=G.hero;let w=0;
  for(const p of G.projectiles){
    p.age+=dt;if(p.age>p.life)continue;
    const nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
    let wall=Infinity;for(const o of World.props)wall=Math.min(wall,segmentCircleT(p.x,p.y,nx,ny,o.x,o.y,o.r+3));
    const hit=h.dead?Infinity:segmentCircleT(p.x,p.y,nx,ny,h.x,h.y,h.r+3);
    if(hit!==Infinity&&hit<=wall){
      if(h.inv>0&&h.dodgeInv>0){p.x=nx;p.y=ny;G.projectiles[w++]=p;continue;}   // 闪避无敌帧：箭矢穿身而过
      const d=Math.hypot(p.vx,p.vy)||1;hurtHero(p.damage,h.x-p.vx/d*40,h.y-p.vy/d*40);
      if(h.dead||G.state!=='play'){w=0;break;}
      continue;
    }
    if(wall!==Infinity||nx<26||ny<26||nx>World.W-26||ny>World.H-26)continue;
    p.x=nx;p.y=ny;G.projectiles[w++]=p;
  }
  G.projectiles.length=w;
}
function updateEnemies(dt){
  const h=G.hero,E=G.enemies;let attackers=0;
  for(const e of E)if(e.state==='windup'||e.state==='strike'||e.state==='eliteWind'||e.state==='eliteStrike'||e.state==='eliteGap')attackers++;
  for(const e of E){
    if(e.dead)continue;
    e.controlGuard=Math.max(0,e.controlGuard-dt);e.armorBreak=Math.max(0,e.armorBreak-dt);e.exposed=Math.max(0,e.exposed-dt);
    e.seenT=visibleForAttack(e)?e.seenT+dt:0;
    e.flash=Math.max(0,e.flash-dt);const ld=Math.exp(-dt*6.5);e.leanX*=ld;e.leanY*=ld;e.recoil*=Math.exp(-dt*6);
    if(e.state!=='bossLeap'){e.x+=e.kx*dt;e.y+=e.ky*dt;}const kd=Math.exp(-dt*8);e.kx*=kd;e.ky*=kd;
    if(Math.abs(e.kx)+Math.abs(e.ky)>150&&Math.random()<dt*22)dust(e.x-e.kdx*8,e.y-e.kdy*8,1,16);
    if(e.dying){e.t+=dt;World.collide(e,e.r);if(e.t>=e.dur){e.dead=true;spawnBodyDebris(e);if(e.boss){spawnBodyDebris(e);spawnBodyDebris(e);}dust(e.x,e.y,3,40);}continue;}
    const dx=h.x-e.x,dy=h.y-e.y,d=Math.hypot(dx,dy)||1,toH=Math.atan2(dy,dx);
    e.atkCd-=dt;
    if(e.archer&&e.state!=='spawn'&&e.state!=='stun'){updateArcher(e,dt);World.collide(e,e.r);continue;}
    if(e.elite&&e.state!=='spawn'&&e.state!=='stun'){attackers+=updateElite(e,dt,attackers);if(e.state!=='bossLeap')World.collide(e,e.r);continue;}
    const moveSpeed=e.speed;
    switch(e.state){
      case 'spawn':e.t+=dt;if(e.t>=e.dur)e.state='chase';break;
      case 'stun':e.t+=dt;if(e.t>=e.dur){e.state='chase';e.atkCd=Math.max(e.atkCd,.25);}break;
      case 'chase':{
        if(h.dead){e.state='idle';break;}
        e.face+=angDiff(e.face,toH)*Math.min(1,dt*7);
        const range=h.r+e.r+(e.brute?22:17);
        if(d>range){e.x+=dx/d*moveSpeed*dt;e.y+=dy/d*moveSpeed*dt;e.walk+=dt*moveSpeed*.16;}
        else if(e.atkCd<=0&&attackers<CFG.enemy.maxAttackers){e.state='windup';e.t=0;e.dur=e.brute?.66:.48;attackers++;if(e.brute)Sfx.warn();}
        else{e.x+=-dy/d*e.orbit*moveSpeed*.35*dt;e.y+=dx/d*e.orbit*moveSpeed*.35*dt;e.walk+=dt*moveSpeed*.07;}
        break;}
      case 'windup':
        e.t+=dt;if(e.t<e.dur*.6)e.face+=angDiff(e.face,toH)*Math.min(1,dt*5);
        if(e.t>=e.dur){e.state='strike';e.t=0;e.dur=.16;e.struck=false;Sfx.enemySwing();}
        break;
      case 'strike':
        e.t+=dt;e.x+=Math.cos(e.face)*55*dt;e.y+=Math.sin(e.face)*55*dt;
        if(!e.struck&&e.t>=e.dur*.45){e.struck=true;
          if(d<enemyReach(e)&&Math.abs(angDiff(e.face,toH))<CFG.enemy.arc)hurtHero((e.brute?rand(16,21):rand(8,12))*e.dm,e.x,e.y);}
        if(e.state==='strike'&&e.t>=e.dur){e.state='recover';e.t=0;e.dur=e.brute?.7:.5;}
        break;

      case 'idle':e.walk+=dt*1.6;break;
    }
    World.collide(e,e.r);
  }
  for(let i=0;i<E.length;i++){
    const a=E[i];if(a.dead||a.dying||a.jz>0)continue;
    for(let j=i+1;j<E.length;j++){
      const b=E[j];if(b.dead||b.dying||b.jz>0)continue;
      const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r;if(Math.abs(dx)>rr||Math.abs(dy)>rr)continue;
      const d=Math.hypot(dx,dy);if(d>=rr)continue;if(d<.01){b.x+=.5;continue;}
      const k=(rr-d)/d*.5;a.x-=dx*k;a.y-=dy*k;b.x+=dx*k;b.y+=dy*k;
    }
    if(!h.dead&&h.dodgeT<=0&&h.jumpZ<=0){
      const dx=a.x-h.x,dy=a.y-h.y,rr=a.r+h.r-2,d=Math.hypot(dx,dy);
      if(d<rr&&d>.01){const k=(rr-d)/d;a.x+=dx*k*.75;a.y+=dy*k*.75;h.x-=dx*k*.25;h.y-=dy*k*.25;}
    }
  }
  if(h.jumpZ<=0)World.collide(h,h.r);
  for(const e of E)if(!e.dead&&e.state!=='bossLeap')World.collide(e,e.r);
  let w=0;for(let i=0;i<E.length;i++)if(!E[i].dead)E[w++]=E[i];E.length=w;
}
function updateFx(dt,rdt){
  for(const f of G.skillFx)f.age+=dt;G.skillFx=G.skillFx.filter(f=>f.age<f.life);
  if(G.notice)G.notice.life=Math.max(0,G.notice.life-rdt);
  if(G.banner)G.banner.life=Math.max(0,G.banner.life-rdt);
  const P=G.particles;let w=0;
  for(let i=0;i<P.length;i++){
    const p=P[i];p.age+=dt;if(p.age>=p.life)continue;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.type==='chip'||p.type==='blood'){p.z+=p.vz*dt;p.vz-=520*dt;p.rot+=p.rv*dt;if(p.z<0){p.z=0;p.vz=-p.vz*.3;p.vx*=.5;p.vy*=.5;p.rv*=.4;}}
    else if(p.type==='dust'){const f=Math.exp(-dt*4);p.vx*=f;p.vy*=f;}
    else if(p.type==='ember'){p.z+=p.vz*dt;p.vx+=rand(-40,40)*dt;}
    P[w++]=p;
  }
  P.length=w;
  const D=G.debris;w=0;
  for(let i=0;i<D.length;i++){
    const d=D[i];d.age+=dt;if(d.age>=d.life)continue;
    d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;d.rot+=d.rv*dt;
    if(d.z>0||d.vz>0)d.vz-=520*dt;
    if(d.z<=0){d.z=0;if(d.vz<-30){d.vz=-d.vz*.35;d.vx*=.55;d.vy*=.55;d.rv*=.5;}else d.vz=0;const f=Math.exp(-dt*8);d.vx*=f;d.vy*=f;d.rv*=f;}
    D[w++]=d;
  }
  D.length=w;
  const N=G.numbers;w=0;
  for(let i=0;i<N.length;i++){const n=N[i];n.age+=rdt;if(n.age>=n.life)continue;n.y+=n.vy*rdt;n.vy*=Math.exp(-rdt*3);N[w++]=n;}
  N.length=w;
  const F=G.flashes;w=0;for(let i=0;i<F.length;i++){const f=F[i];f.age+=rdt;if(f.age<f.life)F[w++]=f;}F.length=w;
  const T=G.trail;while(T.length&&G.t-T[0].t>.14)T.shift();
  G.hurtFx=Math.max(0,G.hurtFx-rdt*2.6);
  const h=G.hero;

    addP({type:'ember',x:p.x+rand(-6,6),y:p.y,z:26,vx:rand(-8,8),vy:0,vz:rand(26,50),age:0,life:rand(.7,1.3)});
}

  g.globalAlpha=.8;g.strokeStyle=color;g.lineWidth=1.2;g.stroke();

  g.restore();
}
function drawRing(g,x,y,range,color,alpha=.7){g.save();g.strokeStyle=color;g.lineWidth=1.5;g.globalAlpha=alpha;g.beginPath();g.arc(x,y,range,0,TAU);g.stroke();g.restore();}

function startWave(n){

    for(let i=q.length-1;i>0;i--){const j=Math.random()*(i+1)|0;const tmp=q[i];q[i]=q[j];q[j]=tmp;}
    for(let i=0;i<(W.e||0);i++)q.splice(Math.min(q.length,2+i*6),0,'elite');

    G.spawnT-=dt;
    if(G.spawnT<=0&&alive<W.cap){if(spawnEnemy(G.queue[0]))G.queue.shift();G.spawnT=Math.max(.55,1.2-.08*G.wave);}

  while(pick.length<3&&pick.length<ok.length&&guard++<200){const r=ok[Math.random()*ok.length|0];if(!pick.includes(r))pick.push(r);}

  const c={mx:0,my:0,aim:null,attack:false,dodge:false,skill:null},st=Input.st,K=Input.keys;

}
(function boot(){
  const canvas=$('game');G.hero=newHero();Render.init(canvas);
  $('skills').innerHTML=ORDER.map(id=>'<button id="sk-'+id+'" class="skillBtn" data-skill="'+id+'"><span class="keycap">'+SKILLS[id].key+'</span>'+SKILLS[id].name+'<small id="cd-'+id+'">就绪</small></button>').join('');
  for(const id of ORDER)$('sk-'+id).addEventListener('pointerdown',e=>{e.preventDefault();Sfx.unlock();requestSkill(id);});
  Input.init({canvas,joy:$('joy'),joyBase:$('joyBase'),knob:$('joyKnob'),atk:$('btnAtk'),dodge:$('btnDodge'),
    onAction:()=>Sfx.unlock(),
    onKey:c=>{
      if(G.state==='forge'){if(/^Digit[1-3]$/.test(c))takeRune(Number(c.slice(-1))-1);return;}
      if(/^Digit[1-4]$/.test(c)){requestSkill(ORDER[Number(c.slice(-1))-1]);return;}
      if(c==='KeyP'||c==='Escape'){if(G.paused)setPause(false);else setPause(true,false);}
      else if(c==='KeyM')toggleMute();
      else if(c==='KeyR'){if(G.state==='dead'||G.state==='win')start(G.oath);}
      else if(c==='Enter'){if(G.paused)setPause(false);else if(G.state==='title')start(0);else if(G.state==='dead'||G.state==='win')start(G.oath);}
    },
    onBlur:loseFocus,onFocus:gainFocus});
  const click=(id,fn)=>$(id).addEventListener('click',e=>{Sfx.unlock();Sfx.ui();fn(e);e.currentTarget.blur();});
  click('btnStart',()=>start(0));
  click('btnOathT',e=>start(Number(e.currentTarget.dataset.o)||0));
  click('btnAgain',()=>start(G.oath));
  click('btnOath',e=>start(Number(e.currentTarget.dataset.o)||0));
  click('btnResume',()=>setPause(false));
  click('btnRestartP',()=>start(G.oath));
  click('btnPause',()=>{if(G.paused)setPause(false);else setPause(true,false);});
  click('btnSnd',toggleMute);
  click('btnMode',()=>setMode(Input.st.mode==='kb'?'touch':'kb'));
  click('btnShake',()=>{G.opt.shake=!G.opt.shake;const b=$('btnShake');b.textContent='震动：'+(G.opt.shake?'开':'关');b.classList.toggle('off',!G.opt.shake);});
  $('forgeCards').addEventListener('click',e=>{const b=e.target.closest?e.target.closest('.rune'):null;if(b)takeRune(Number(b.dataset.i));});
  document.querySelectorAll('.modeBtn').forEach(b=>b.addEventListener('click',e=>{Sfx.unlock();Sfx.ui();setMode(b.dataset.mode);e.currentTarget.blur();}));
  const mm=q=>!!(window.matchMedia&&matchMedia(q).matches);
  setMode(mm('(pointer:coarse)')&&!mm('(pointer:fine)')?'touch':'kb');
  addEventListener('touchstart',()=>{if(Input.st.mode!=='touch')setMode('touch');},{once:true,passive:true});
  try{const best=Number(localStorage.getItem('rf_best'))||0;
    if(best>0){uiText('bestTxt','已完成远征 · 可挑战铁誓 '+best+'（敌人生命 +'+best*30+'%，伤害 +'+best*25+'%）');const b=$('btnOathT');b.textContent='以铁誓 '+best+' 出征';b.dataset.o=String(best);b.classList.remove('hidden');}
  }catch(_){}
  renderRunes();syncUI(true);
  requestAnimationFrame(ts=>{lastTs=ts;requestAnimationFrame(frame);});
})();
})();
</script>
</body>
</html>
