<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>骸原铁誓 · 近战试炼 V2</title>
<style>
:root{--ink:#0a090b;--bone:#d8ccb0;--dim:#978a6c;--edge:#5d543f;--gold:#bfa66a;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050506;overflow:hidden;color:var(--bone);
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.panel{position:relative;background:linear-gradient(180deg,rgba(34,31,30,.94),rgba(15,14,15,.95));border:2px solid var(--ink);
  outline:1px solid rgba(150,134,96,.45);outline-offset:-4px;box-shadow:0 0 0 1px rgba(110,98,70,.55),0 5px 16px rgba(0,0,0,.65)}
.panel::before,.panel::after{content:"";position:absolute;width:9px;height:9px;border:2px solid var(--gold);opacity:.75;pointer-events:none}
.panel::before{left:-2px;top:-2px;border-right:none;border-bottom:none}
.panel::after{right:-2px;bottom:-2px;border-left:none;border-top:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font-size:12px;letter-spacing:2px;color:var(--dim);white-space:nowrap}
b{font-weight:700;color:#eadfc0;font-size:15px}
.sep{width:1px;height:12px;background:#4a4437;margin:0 1px;display:inline-block}
#hudL{position:fixed;left:calc(10px + var(--sl));top:calc(10px + var(--st));padding:10px 14px 9px;width:min(310px,56vw);z-index:10;pointer-events:none}
#hudL .row+.row{margin-top:6px}
#hpBar{position:relative;flex:1;min-width:80px;height:15px;background:#0b090a;border:2px solid var(--ink);box-shadow:0 0 0 1px #6a604b,inset 0 2px 4px #000;overflow:hidden}
#hpLag{position:absolute;left:0;top:0;bottom:0;width:100%;background:#cbb47a;opacity:.55}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#b3261c,#7a120d 55%,#4a0907)}
#hpBar::after{content:"";position:absolute;left:0;top:0;right:0;bottom:0;
  background:repeating-linear-gradient(115deg,transparent 0 5px,rgba(0,0,0,.22) 5px 6px),repeating-linear-gradient(90deg,transparent 0 24.2%,rgba(0,0,0,.6) 24.2% 25%)}
#hpTxt{min-width:30px;text-align:right}
#dgBar{position:relative;width:74px;height:8px;background:#0b090a;border:1px solid var(--ink);box-shadow:0 0 0 1px #5a5242;overflow:hidden}
#dgFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#d9d3c0,#8d8773)}
#dgBar.cd #dgFill{background:linear-gradient(180deg,#6d6a60,#45433d)}
#dgTxt{font-size:12px;color:#d6c9a4;min-width:30px;letter-spacing:1px}
#dgTxt.cd{color:#7a7465}
#hudR{position:fixed;right:calc(10px + var(--sr));top:calc(10px + var(--st));z-index:10;display:flex;flex-direction:column;align-items:flex-end;gap:7px;max-width:min(450px,46vw)}
#bar{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap;justify-content:flex-end}
#setPanel{padding:9px 11px}
#setPanel .row+.row{margin-top:7px}
.tag{font-size:11.5px;padding:2px 6px;border:1px solid #3d382d;color:#cbbd98;background:rgba(0,0,0,.4);letter-spacing:1px;white-space:nowrap}
.tag.off{color:#6d6656;text-decoration:line-through}
button{font:inherit;color:#d0c29e;background:linear-gradient(180deg,#34312f,#1a1919);border:2px solid var(--ink);box-shadow:0 0 0 1px var(--edge),inset 0 1px 0 rgba(255,240,200,.07);
  padding:5px 9px;font-size:12.5px;letter-spacing:.5px;cursor:pointer;border-radius:0;touch-action:manipulation}
button:hover{color:#f4e6bc;box-shadow:0 0 0 1px #9c8a60,inset 0 1px 0 rgba(255,240,200,.1)}
button.off{color:#77705f}
button.big{font-size:17px;padding:11px 30px;letter-spacing:4px;color:#ecdcae;box-shadow:0 0 0 1px #9c8a60}
button.sel{color:#f4e6bc;background:linear-gradient(180deg,#4a4132,#272219);box-shadow:0 0 0 1px #c2a868}
input[type=range]{width:104px;accent-color:#9c8452;cursor:pointer}
#zoomTxt{font-size:12.5px;min-width:38px;color:#e6d9b8}
#hint{position:fixed;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);font-size:12.5px;letter-spacing:1px;color:#b0a482;opacity:.8;pointer-events:none;z-index:9;
  text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap;transition:opacity 1.2s}
#hint.fade{opacity:0}
#touchUI{display:none}
body.touch #touchUI{display:block}
body.touch #hint{display:none}
#joy{position:fixed;left:0;bottom:0;width:46vw;height:52vh;z-index:8;touch-action:none}
#joyBase{position:absolute;left:calc(26px + var(--sl));bottom:calc(30px + var(--sb));width:132px;height:132px;border-radius:50%;border:2px solid rgba(160,145,105,.5);
  background:radial-gradient(circle,rgba(30,28,32,.3),rgba(10,10,12,.6));box-shadow:inset 0 0 18px #000,0 0 0 2px rgba(0,0,0,.6)}
#joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#6a6458,#2a2824);border:2px solid var(--ink);box-shadow:0 0 0 1px #8c7c58,0 3px 8px #000}
.tbtn{position:fixed;z-index:8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#eadcb2;border:2px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#5a2320,#250c0b);box-shadow:0 0 0 2px #8c7c58,0 4px 12px #000,inset 0 1px 0 rgba(255,220,180,.15);touch-action:none}
#btnAtk{right:calc(24px + var(--sr));bottom:calc(36px + var(--sb));width:96px;height:96px;font-size:30px}
#btnAtk.on{filter:brightness(1.45)}
#btnDodge{right:calc(136px + var(--sr));bottom:calc(22px + var(--sb));width:66px;height:66px;font-size:20px;background:radial-gradient(circle at 35% 30%,#4a4a52,#1b1b20)}
#btnDodge.cd{opacity:.38}
.overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20}
.hidden{display:none!important}
#ovTitle{background:radial-gradient(ellipse at center,rgba(5,5,7,.3) 0%,rgba(4,4,6,.88) 75%)}
#ovPause{background:rgba(4,4,6,.6)}
#ovDead{align-items:flex-end;padding-bottom:calc(5vh + var(--sb));background:linear-gradient(180deg,rgba(0,0,0,0) 58%,rgba(0,0,0,.8));animation:fadeIn 1.1s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{padding:26px 34px 24px;text-align:center;max-width:92vw;max-height:96vh;overflow:auto}
#ovDead .card{padding:14px 30px 16px}
h1{margin:0 0 4px;font-size:clamp(30px,6vw,58px);letter-spacing:10px;font-weight:700;background:linear-gradient(180deg,#f1e2b4,#a88c50 55%,#5e4a28);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:26px;letter-spacing:8px;color:#d9c592}
.sub{font-size:12.5px;letter-spacing:5px;color:#8f8368;margin-bottom:16px}
.txt{font-size:13.5px;line-height:1.9;color:#b3a788;margin:10px 0 16px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
#deadStats{font-size:15px;letter-spacing:2px;color:#d6c8a2;margin:6px 0 12px}
@media (max-width:760px),(max-height:480px){
  #hudL{padding:7px 10px 6px;width:min(236px,52vw)} #hudL .row+.row{margin-top:4px}
  .lbl{letter-spacing:1px;font-size:11px} b{font-size:13.5px} #hpBar{height:12px} #dgBar{width:56px}
  #bar{padding:5px 6px;gap:4px} .tag{font-size:10.5px;padding:1px 4px} #setPanel{padding:7px 8px}
  button{padding:4px 7px;font-size:11.5px} input[type=range]{width:78px}
  .card{padding:14px 18px} h1{letter-spacing:6px} .txt{margin:6px 0 10px;line-height:1.6} .sub{margin-bottom:8px} .modes{margin-bottom:10px}
  button.big{padding:8px 22px;font-size:15px} h2{font-size:21px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hudL" class="panel">
  <div class="row"><span class="lbl">生命</span><div id="hpBar"><div id="hpLag"></div><div id="hpFill"></div></div><b id="hpTxt">100</b></div>
  <div class="row"><span class="lbl">斩杀</span><b id="kills">0</b><i class="sep"></i><span class="lbl">存活</span><b id="time">0:00</b><i class="sep"></i><span class="lbl">敌</span><b id="foes">0</b></div>
  <div class="row"><span class="lbl">闪避</span><div id="dgBar"><div id="dgFill"></div></div><span id="dgTxt">就绪</span></div>
</div>

<div id="hudR">
  <div id="bar" class="panel">
    <span class="tag" id="tgMode">键鼠</span><span class="tag" id="tgSnd">音</span><span class="tag" id="tgShake">震</span><span class="tag" id="tgZoom">100%</span>
    <button id="btnPause">暂停</button><button id="btnSet">设置</button>
  </div>
  <div id="setPanel" class="panel">
    <div class="row"><button id="btnMode">操作：键鼠</button><button id="btnSnd">音效：开</button><button id="btnShake">震动：开</button></div>
    <div class="row"><span class="lbl">镜头</span><input id="zoom" type="range" min="0.75" max="1.5" step="0.05" value="1"><span id="zoomTxt">100%</span><button id="btnZoomR">复位</button></div>
  </div>
</div>

<div id="hint"></div>

<div id="touchUI">
  <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div></div>
  <div id="btnDodge" class="tbtn">避</div>
  <div id="btnAtk" class="tbtn">斩</div>
</div>

<div id="ovTitle" class="overlay">
  <div class="card panel">
    <h1>骸原铁誓</h1>
    <div class="sub">ASHEN OATH · 近战试炼</div>
    <div class="txt">亡骨自灰土中爬起，永无止息。<br>握紧大剑——斩，直到倒下。</div>
    <div class="modes">
      <button class="modeBtn" data-mode="kb">键鼠：WASD + 鼠标瞄准</button>
      <button class="modeBtn" data-mode="mouse">鼠标：右键行走 / 左键斩</button>
      <button class="modeBtn" data-mode="touch">触屏：摇杆 + 按钮</button>
    </div>
    <button id="btnStart" class="big">踏入战场</button>
  </div>
</div>

<div id="ovPause" class="overlay hidden">
  <div class="card panel">
    <h2>暂 停</h2>
    <div class="txt" id="pauseWhy"></div>
    <button id="btnResume" class="big">继续</button>
  </div>
</div>

<div id="ovDead" class="overlay hidden">
  <div class="card panel">
    <h2>汝已倒下</h2>
    <div id="deadStats"></div>
    <button id="btnRestart" class="big">再战一场</button>
  </div>
</div>

<script>
/* 骸原铁誓 V2 —— 基于 V1 的单文件近战战斗样本。全部美术/音效为程序化生成，无外部依赖。
   说明：本文件为手写交付，未声明经过任何实机测试。 */
(() => {
'use strict';

/* =====================================================================
   1. 配置 CONFIG
   ===================================================================== */
const CFG = {
  world: { w: 4000, h: 3000, chunk: 400, cell: 50, res: 1.5, maxChunks: 36 },
  view:  { base: 560, minBase: .95, zoomMin: .75, zoomMax: 1.5, zoomDef: 1 },
  loop:  { maxDt: .05, stall: .5 },                        // 单帧最大步长 / 帧停滞自动暂停阈值（秒）
  hero:  { r: 15, speed: 176, hp: 100, blade: 60, healOnKill: 2, hipZ: 9, bodyZ: 17, headZ: 27 },
  atk:   { windup: .16, windupChain: .12, swing: .14, recover: .28, chainAt: .1,
           dmgMin: 30, dmgMax: 42, crit: .12, critMul: 1.75, lunge: 170, buffer: .2 },
  dodge: { time: .26, speed: 520, cd: .8, inv: .24 },
  enemy: { max: 22, maxAttackers: 3, hp: 58, bruteHp: 150, maxBrutes: 3, arc: 1.0, reach: 24, bruteReach: 30, dieTime: .36 },
  fx:    { maxParticles: 220, maxDebris: 150, maxNumbers: 40, maxTrail: 90, maxFlashes: 12, maxVoices: 48,
           stopHit: .045, stopCrit: .075, stopKill: .06, stopCap: .13 }
};

/* =====================================================================
   2. 工具 UTIL
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rot = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };
function hashI(i, j, p) { return (Math.imul(i, 73856093) ^ Math.imul(j, 19349663) ^ Math.imul(p | 0, 83492791)) >>> 0; }
function hash2(x, y) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
}
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1e-6;
  const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
  const cx = ax + dx * t, cy = ay + dy * t;
  return { d: Math.hypot(px - cx, py - cy), x: cx, y: cy };
}
function elbow(x1, y1, x2, y2, l1, l2, sg) {
  const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1e-4;
  const dm = Math.min(d, l1 + l2 - .01);
  const a = (l1 * l1 - l2 * l2 + dm * dm) / (2 * dm);
  const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
  const ux = dx / d, uy = dy / d;
  return [x1 + ux * a - uy * hh * sg, y1 + uy * a + ux * hh * sg];
}

/* =====================================================================
   3. 音频 AUDIO（WebAudio 程序化音效；首次操作解锁；暂停/失焦挂起；重开清理）
   ===================================================================== */
const Sfx = (() => {
  let ac = null, master = null, nbuf = null, muted = false, wantSuspend = false;
  const live = new Map(), last = {};
  function resume() { try { const p = ac.resume(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  function halt() { try { const p = ac.suspend(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try {
        ac = new AC();
        master = ac.createGain(); master.gain.value = muted ? 0 : .85;
        const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 5;
        master.connect(comp); comp.connect(ac.destination);
        nbuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 1.5), ac.sampleRate);
        const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        startAmb();
      } catch (err) { ac = null; return; }
    }
    if (wantSuspend) { if (ac.state === 'running') halt(); }
    else if (ac.state !== 'running') resume();
  }
  function startAmb() {                                    // 环境底噪：只创建一次，不进入 live，重开不叠加
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 230;
    const g = ac.createGain(); g.gain.value = .045;
    const lfo = ac.createOscillator(); lfo.frequency.value = .07; const lg = ac.createGain(); lg.gain.value = 70;
    lfo.connect(lg); lg.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(master); s.start(); lfo.start();
  }
  function keep(src, g) { live.set(src, g); src.onended = () => { live.delete(src); try { g.disconnect(); } catch (e) {} }; }
  function env(g, t, vol, atk, dur) {
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + atk);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  }
  function noise(o) {
    if (live.size >= CFG.fx.maxVoices) return;
    const t = ac.currentTime + (o.at || 0);
    const s = ac.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass';
    f.frequency.setValueAtTime(o.f0, t); if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    f.Q.value = o.q || 1;
    const g = ac.createGain(); env(g, t, o.vol, o.atk || .004, o.dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t, Math.random()); s.stop(t + o.dur + .03); keep(s, g);
  }
  function tone(o) {
    if (live.size >= CFG.fx.maxVoices) return;
    const t = ac.currentTime + (o.at || 0);
    const os = ac.createOscillator(); os.type = o.type || 'sine';
    os.frequency.setValueAtTime(o.f0, t); if (o.f1) os.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
    const g = ac.createGain(); env(g, t, o.vol, o.atk || .004, o.dur);
    os.connect(g); g.connect(master); os.start(t); os.stop(t + o.dur + .03); keep(os, g);
  }
  function ok(name, gap) {
    if (!ac || muted || ac.state !== 'running') return false;
    const t = ac.currentTime; if (last[name] !== undefined && t - last[name] < gap) return false;
    last[name] = t; return true;
  }
  return {
    unlock,
    setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : .85; },
    isMuted() { return muted; },
    suspend(b) { wantSuspend = b; if (!ac) return; if (b) halt(); else resume(); },
    stopAll() {
      for (const [s, g] of live) { try { s.onended = null; s.stop(); } catch (e) {} try { s.disconnect(); g.disconnect(); } catch (e) {} }
      live.clear(); for (const k in last) delete last[k];
    },
    swing() { if (!ok('sw', .05)) return; const p = rand(.92, 1.1);
      noise({ dur: .2, f0: 380 * p, f1: 2600 * p, q: 1.1, vol: .34, atk: .055 });
      noise({ dur: .15, type: 'lowpass', f0: 520, f1: 190, vol: .13, atk: .03 }); },
    hit(crit, kill, brute) { if (!ok('hit', .025)) return; const p = rand(.9, 1.12);
      tone({ f0: 165 * p, f1: 48, dur: .13, vol: crit ? .68 : .5 });
      noise({ dur: .065, f0: 1900 * p, f1: 700, q: .8, vol: crit ? .46 : .36, atk: .002 });
      noise({ dur: .03, type: 'highpass', f0: 3800, vol: .16, atk: .001 });
      if (brute) tone({ type: 'triangle', f0: 840 * p, f1: 780, dur: .16, vol: .06 });
      if (crit) { tone({ type: 'triangle', f0: 1180 * p, f1: 1040, dur: .28, vol: .1 }); tone({ type: 'square', f0: 2380 * p, dur: .1, vol: .025 }); tone({ f0: 82, f1: 36, dur: .24, vol: .4 }); }
      if (kill) { for (let i = 0; i < 4; i++) noise({ at: .05 + i * .06 + Math.random() * .02, dur: .04, f0: rand(1400, 3200), q: 7, vol: .2, atk: .002 });
        tone({ at: .02, f0: 95, f1: 40, dur: .2, vol: .28 }); } },
    step() { if (!ok('st', .12)) return;
      noise({ dur: .06, type: 'lowpass', f0: rand(200, 280), vol: .13, atk: .003 });
      noise({ dur: .025, f0: rand(3400, 4200), q: 4, vol: .022, atk: .002 }); },
    hurt() { if (!ok('hu', .08)) return;
      tone({ type: 'sawtooth', f0: 170, f1: 70, dur: .2, vol: .22 });

  }
  function show(id, on) { $(id).classList.toggle('hidden', !on); }
  function setZoom(v) { v = clamp(v, CFG.view.zoomMin, CFG.view.zoomMax); G.cam.zoomT = v; $('zoom').value = v; const t = Math.round(v * 100) + '%'; $('zoomTxt').textContent = t; $('tgZoom').textContent = t; }
  return { setMode, sync, show, setZoom, fmt, showHint };
})();

const canRun = () => G.state === 'play' || G.state === 'dying';

/* 重开：清空敌人/粒子/碎骨/数字/拖影/计时/输入/旧音效与全部临时状态；保留用户设置（模式、静音、震动、缩放） */
function reset() {
  G.enemies.length = 0; G.particles.length = 0; G.debris.length = 0; G.numbers.length = 0; G.flashes.length = 0; G.trail.length = 0;
  G.kills = 0; G.time = 0; G.t = 0; G.hitStop = 0; G.timeScale = 1; G.spawnT = 1.1; G.deadClock = 0; G.hurtFx = 0; G.nextId = 1; G.paused = false;
  G.hero = newHero();
  const c = G.cam; c.x = G.hero.x; c.y = G.hero.y; c.trauma = 0; c.kx = c.ky = c.sx = c.sy = 0; c.dz = 0;
  Input.reset(); Sfx.stopAll(); UI.sync(true);
}
function start() {
  Sfx.unlock(); reset(); G.state = 'play'; Sfx.suspend(false);
  UI.show('ovTitle', false); UI.show('ovPause', false); UI.show('ovDead', false); UI.showHint();
  if (Input.st.mode === 'touch') UI.show('setPanel', false);
}
/* 暂停：play 与 dying 均可暂停；恢复只能由明确操作触发（按钮 / P / Esc / Enter） */
function setPause(p, auto) {
  if (p) {
    if (G.paused || !canRun()) return;
    G.paused = true; Input.reset(); Sfx.suspend(true);
    $('pauseWhy').innerHTML = auto ? '检测到失焦 / 页面隐藏 / 帧停滞，已自动暂停。<br>点击「继续」或按 P / Enter 恢复。' : 'P / Esc / Enter 继续 · M 静音<br>空格 / Shift 闪避（短暂无敌，仅有冷却）';
    UI.show('ovPause', true);
  } else {
    if (!G.paused) return;
    G.paused = false; Input.reset(); Sfx.suspend(false); UI.show('ovPause', false);
  }
}
function loseFocus() { Input.reset(); if (canRun()) setPause(true, true); else if (!G.paused) Sfx.suspend(true); }
function gainFocus() { Input.reset(); if (!G.paused && !document.hidden) Sfx.suspend(false); }   // 仅恢复非对局状态的音频；对局保持暂停
function toggleMute() { const m = !Sfx.isMuted(); Sfx.setMuted(m); const b = $('btnSnd'); b.textContent = '音效：' + (m ? '关' : '开'); b.classList.toggle('off', m); $('tgSnd').classList.toggle('off', m); }
function toggleShake() { G.opt.shake = !G.opt.shake; const b = $('btnShake'); b.textContent = '震动：' + (G.opt.shake ? '开' : '关'); b.classList.toggle('off', !G.opt.shake); $('tgShake').classList.toggle('off', !G.opt.shake); }

function sampleControls() {
  const c = { mx: 0, my: 0, aim: null, attack: false, dodge: false }, st = Input.st, K = Input.keys;
  const dq = st.dodgeQ; st.dodgeQ = false;
  if (G.state !== 'play' || G.paused) return c;
  const h = G.hero; c.dodge = dq;
  if (st.mode === 'kb') {
    c.mx = (K.has('KeyD') || K.has('ArrowRight') ? 1 : 0) - (K.has('KeyA') || K.has('ArrowLeft') ? 1 : 0);
    c.my = (K.has('KeyS') || K.has('ArrowDown') ? 1 : 0) - (K.has('KeyW') || K.has('ArrowUp') ? 1 : 0);
    const l = Math.hypot(c.mx, c.my); if (l > 1) { c.mx /= l; c.my /= l; }       // 组合方向归一化
    const w = s2w(st.mx, st.my); c.aim = Math.atan2(w[1] - (h.y - 12), w[0] - h.x); c.attack = st.lmb || K.has('KeyJ');
  } else if (st.mode === 'mouse') {
    const w = s2w(st.mx, st.my), dx = w[0] - h.x, dy = w[1] - (h.y - 12), d = Math.hypot(dx, dy);
    c.aim = d > 6 ? Math.atan2(dy, dx) : h.aim;
    if (st.rmb && d > 16) { const k = Math.min(1, d / 50); c.mx = dx / d * k; c.my = dy / d * k; }   // 仅按住右键时行走，无点击寻路
    c.attack = st.lmb;
  } else {
    const l = Math.hypot(st.jx, st.jy);
    if (l > .2) { const k = Math.min(1, (l - .2) / .7) / l; c.mx = st.jx * k; c.my = st.jy * k; }
    c.attack = st.atk;
  }
  return c;
}
function updateCamera(rdt) {
  const cam = G.cam, h = G.hero;
  cam.zoom += (cam.zoomT - cam.zoom) * Math.min(1, rdt * 10);
  const dzT = (G.state === 'dying' || G.state === 'dead') ? 1 : 0; cam.dz += (dzT - cam.dz) * Math.min(1, rdt * 1.2);
  View.scale = View.base * cam.zoom * (1 + .07 * cam.dz);
  let tx = h.x, ty = h.y - 10;
  if (G.state === 'play' && !G.paused && Input.st.mode !== 'touch') { const w = s2w(Input.st.mx, Input.st.my); tx += clamp((w[0] - h.x) * .1, -45, 45); ty += clamp((w[1] - h.y) * .1, -35, 35); }
  const k = 1 - Math.exp(-rdt * 7); cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k;
  const hw = View.cw / (2 * View.scale), hh = View.ch / (2 * View.scale);
  if (hw - 90 < World.W - hw + 90) cam.x = clamp(cam.x, hw - 90, World.W - hw + 90);
  if (hh - 90 < World.H - hh + 90) cam.y = clamp(cam.y, hh - 90, World.H - hh + 90);
  cam.trauma = Math.max(0, cam.trauma - rdt * 2.6); const kd = Math.exp(-rdt * 20); cam.kx *= kd; cam.ky *= kd;
  if (G.opt.shake) {
    const a = cam.trauma * cam.trauma * 5.5;
    cam.sx = (Math.sin(G.rt * 71) + Math.sin(G.rt * 113 + 1.3)) * .5 * a + cam.kx;
    cam.sy = (Math.sin(G.rt * 83 + 2.1) + Math.sin(G.rt * 127 + .7)) * .5 * a + cam.ky;
  } else { cam.sx = cam.sy = 0; }
}
function update(rdt) {
  if (G.paused) { updateCamera(rdt); return; }             // 暂停：世界完全冻结，仅允许缩放平滑
  G.rt += rdt;
  let dt = rdt * G.timeScale;
  if (G.hitStop > 0) { G.hitStop -= rdt; dt *= .03; }      // 命中停顿
  G.t += dt;
  const c = sampleControls();
  updateHero(dt, c);
  if (G.state === 'play') {
    G.time += dt; updateSpawner(dt);
    if (G.hintT > 0) { G.hintT -= rdt; if (G.hintT <= 0) $('hint').classList.add('fade'); }
  }
  updateEnemies(dt);
  updateFx(dt, rdt);
  updateCamera(rdt);
  if (G.state === 'dying') {                               // 先完整播放倒地（跪 → 倒 → 剑落地 → 静止），再出重开界面
    G.deadClock += rdt; G.timeScale = Math.min(1, .35 + G.deadClock * .5);
    if (G.deadClock >= 3.0) { G.state = 'dead'; G.timeScale = 1; $('deadStats').textContent = '斩杀 ' + G.kills + '　·　存活 ' + UI.fmt(G.time); UI.show('ovDead', true); }
  }
  UI.sync(false);
}

let lastTs = 0;
function frame(ts) {
  let gap = (ts - lastTs) / 1000; lastTs = ts; if (!(gap >= 0)) gap = 0;
  if (document.hidden) { if (canRun() && !G.paused) loseFocus(); gap = 0; }                         // 兜底 1：事件漏发时逐帧检查隐藏
  else if (gap > CFG.loop.stall && canRun() && !G.paused) { setPause(true, true); gap = 0; }        // 兜底 2：帧停滞（后台节流/冻结/休眠）即暂停并丢弃该帧
  update(Math.min(CFG.loop.maxDt, gap)); Render.draw();
  requestAnimationFrame(frame);
}

(function boot() {
  const canvas = $('game');
  G.hero = newHero();
  Render.init(canvas);
  Input.init({
    canvas, joy: $('joy'), joyBase: $('joyBase'), knob: $('joyKnob'), atk: $('btnAtk'), dodge: $('btnDodge'),
    onAction: () => Sfx.unlock(),
    onKey: c => {
      if (c === 'KeyP' || c === 'Escape') { if (G.paused) setPause(false); else setPause(true, false); }
      else if (c === 'KeyM') toggleMute();
      else if (c === 'KeyR') { if (G.state === 'dead') start(); }
      else if (c === 'Enter') { if (G.paused) setPause(false); else if (G.state === 'title' || G.state === 'dead') start(); }
    },
    onWheel: dy => UI.setZoom(Math.round((G.cam.zoomT + (dy > 0 ? -.05 : .05)) * 20) / 20),
    onBlur: loseFocus, onFocus: gainFocus
  });
  const click = (id, fn) => $(id).addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); fn(e); e.currentTarget.blur(); });
  const order = ['kb', 'mouse', 'touch'];
  click('btnMode', () => UI.setMode(order[(order.indexOf(Input.st.mode) + 1) % 3]));
  click('btnSnd', toggleMute);
  click('btnShake', toggleShake);
  click('btnPause', () => { if (G.paused) setPause(false); else setPause(true, false); });
  click('btnSet', () => $('setPanel').classList.toggle('hidden'));
  click('btnZoomR', () => UI.setZoom(CFG.view.zoomDef));
  click('btnStart', start); click('btnRestart', start); click('btnResume', () => setPause(false));
  document.querySelectorAll('.modeBtn').forEach(b => b.addEventListener('click', e => { Sfx.unlock(); Sfx.ui(); UI.setMode(b.dataset.mode); e.currentTarget.blur(); }));
  const z = $('zoom');
  z.addEventListener('input', () => UI.setZoom(parseFloat(z.value)));
  z.addEventListener('change', () => z.blur()); z.addEventListener('pointerup', () => z.blur());
  const mm = q => !!(window.matchMedia && matchMedia(q).matches);
  const coarse = mm('(pointer:coarse)') && !mm('(pointer:fine)');
  UI.setMode(coarse ? 'touch' : 'kb');
  UI.show('setPanel', !coarse && innerWidth >= 900);      // 小屏 / 触屏默认收起设置，状态标签常驻
  UI.setZoom(CFG.view.zoomDef); G.cam.zoom = CFG.view.zoomDef;
  UI.sync(true);
  requestAnimationFrame(ts => { lastTs = ts; requestAnimationFrame(frame); });
})();

})();
</script>
</body>
</html>
